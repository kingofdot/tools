<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* annotation-guide.css · 서류 폼 입력 안내(2안: 주황 박스 + 화살표 + 콜아웃) */
/* 폰트: Pretendard Variable 권장. 없으면 시스템 산세리프로 폴백. */

.ag{--ag-ink:#0f172a;--ag-sub:#5b6779;--ag-line:#e2e8f0;--ag-accent:#ea580c;--ag-accent-ink:#9a3412;--ag-accent-line:#fcd9bd;--ag-accent-chip:#fff3ea;
  /* 강조 계열 투명도는 여기서만 조절한다 */
  --ag-box-line:rgba(234,88,12,.45);        /* 박스 테두리 */
  --ag-fill-a:rgba(234,88,12,.055);         /* 박스 필 · 왼쪽 */
  --ag-fill-b:rgba(234,88,12,.005);         /* 〃 오른쪽(거의 투명) */
  --ag-glow:rgba(234,88,12,.20);            /* 테두리 바깥으로 번지는 빛 */
  --ag-wire:rgba(234,88,12,.50);            /* 연결 점선 */
  /* 주황은 박스·번호·지시선·설명박스에만 쓴다. 나머지 UI 는 원문 화면의 파랑을 따른다. */
  --ag-blue:#2B62EF;                        /* 원문 주 버튼 파랑 */
  --ag-blue-ink:#1E4FD0;                    /* 글자용 · 한 단계 짙게 */
  --ag-blue-chip:#EAF0FE;                   /* 스카이 블루 칩 배경 */
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ag-ink);position:relative;width:1010px;background:#fff;border:1px solid var(--ag-line);border-radius:16px;overflow:hidden}

/* 카드 헤더 */
.ag-head{padding:22px 30px 20px;border-bottom:1px solid var(--ag-line);display:flex;align-items:baseline;gap:12px}
.ag-step{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ag-blue)}
.ag-head h2{margin:0;font-size:21px;letter-spacing:-.02em}
.ag-head p{margin:0;font-size:13px;color:var(--ag-sub)}

/* 패널(= 섹션을 2~3개 항목 단위로 쪼갠 블록) */
.ag-panels{padding:8px 30px 30px}
.ag-panel{padding:22px 0 26px;border-top:1px solid #f1f5f9}
.ag-panel:first-child{border-top:0}
.ag-plabel{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:12.5px;font-weight:700;color:var(--ag-blue-ink)}
.ag-pno{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--ag-blue-ink);background:var(--ag-blue-chip);border-radius:5px;padding:2px 7px}

/* 스테이지: 스크린샷 + 박스 + 화살표 + 콜아웃을 절대좌표로 얹는 좌표계 */
.ag-stage{position:relative}
.ag-img{position:absolute;left:0;top:0}
.ag-img img{display:block;width:100%;border:1px solid var(--ag-line);border-radius:8px}

/* 강조 박스 · 번호 */
/* box-sizing 을 반드시 border-box 로. 없으면 2px 테두리가 밖으로 더해져
   박스 오른쪽·아래가 4px 씩 커지고, 연결선이 박스 안으로 파고든다. */
/* 바깥으로는 단단한 링 대신 blur 로 번지게 해서 경계가 투명하게 사라지도록 한다.
   0 0 9px 1px = 테두리에서 1px 벌린 뒤 9px 에 걸쳐 서서히 사라짐. */
.ag-box{position:absolute;box-sizing:border-box;border:1px solid var(--ag-box-line);border-radius:6px;
  background:linear-gradient(95deg,var(--ag-fill-a),var(--ag-fill-b));
  box-shadow:0 0 9px 1px var(--ag-glow)}
/* 번호는 알약이 아니라 **정원**. 좌우 패딩이 없어 자리를 덜 차지한다. */
.ag-num{position:absolute;transform:translate(-50%,-50%);width:16px;height:16px;padding:0;border-radius:50%;background:var(--ag-accent);color:#fff;font-size:9.5px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1.5px #fff}

/* 연결선 · 화살촉 없이 얇은 점선 곡선. 꺾인 직선 대신 3차 베지어 한 획. */
.ag-wire{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.ag-wire path{fill:none;stroke:var(--ag-wire);stroke-width:1;stroke-dasharray:3 4;stroke-linecap:round}

/* 설명 콜아웃 */
.ag-co{position:absolute;background:#fff;border:1px solid var(--ag-accent-line);border-radius:9px;padding:9px 12px;box-shadow:0 2px 6px rgba(124,45,18,.07)}
.ag-co h3{margin:0 0 3px;font-size:12.5px;font-weight:700;letter-spacing:-.01em;color:var(--ag-accent-ink)}
.ag-co p{margin:0;font-size:12px;line-height:1.55;color:var(--ag-sub);text-wrap:pretty}


html,body{margin:0;padding:36px;background:#fff}
</style></head><body><div id="root"></div>
<script>
/* annotation-guide.js · 데이터(JSON) → 주석 패널 HTML 렌더러. 의존성 없음.
   사용: renderGuideSection(sectionData) → HTML 문자열
   좌표계: 모든 박스 b=[x,y,w,h]는 "섹션 원본 스크린샷" 좌표(cw × ch) 기준.
           패널 이미지는 섹션 스크린샷을 crop=[x,y,w,h]로 잘라낸 것.
*/
(function (global) {
  const LAYOUT = {
    // IX(이미지 왼쪽 들여쓰기)가 18 이면 스테이지 폭이 18+600+22+326=966 이 되어
    // 카드 안쪽 948 을 넘고, .ag{overflow:hidden} 에 콜아웃 오른쪽이 잘렸다.
    // 번호가 작은 정원으로 바뀌어 왼쪽 여백이 더는 필요 없으므로 IX 를 0 으로 둔다.
    side: { IW: 600, GAP: 22, CW: 326, IX: 0, CPL: 34 },  // 세로로 나열된 항목 → 콜아웃 우측
    below: { IW: 940, CW: 226, LANE: 24, CPL: 22 },       // 가로로 나열된 항목 → 콜아웃 아래
  };
  const BP = 2;   // 박스를 대상 바깥으로 띄우는 여백(px). 사면 동일.
  const IB = 1;   // .ag-img img 의 1px 테두리 · 스크린샷 원점이 그만큼 밀린다.
  // 번호 위치: 'corner' = 박스 왼쪽 위 모서리 중심, 'outside' = 박스 왼쪽 바깥(위 정렬)
  const NUM = { place: 'corner', gap: 6, w: 22 };
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const estH = (text, cpl) => 34 + Math.max(1, Math.ceil(text.length / cpl)) * 19; // 콜아웃 높이 추정

  function toRows(sec, group, k) {
    return group.f.map((idx) => {
      const f = sec.f[idx], b = f.b;
      return {
        n: idx + 1, f,
        x: Math.round((b[0] - group.crop[0]) * k) + IB,
        y: Math.round((b[1] - group.crop[1]) * k) + IB,
        w: Math.round(b[2] * k),
        h: Math.round(b[3] * k),
      };
    });
  }

  function sidePanel(sec, group, gi) {
    const { IW, GAP, CW, IX, CPL } = LAYOUT.side;
    const k = IW / group.crop[2], IH = Math.round(group.crop[3] * k);
    const MID = IX + IW + 11, CX = IX + IW + GAP;
    const rows = toRows(sec, group, k);
    let cy = 0;
    rows.forEach((r) => { // 콜아웃은 박스 세로 중심에 맞추고, 겹치면 아래로 밀어냄
      r.ch = estH(r.f.desc, CPL);
      const c = r.y + r.h / 2;
      r.ct = Math.max(cy, Math.round(c - r.ch / 2));
      cy = r.ct + r.ch + 10;
    });
    const boxes = rows.map((r) => `<div class="ag-box" style="left:${r.x - BP}px;top:${r.y - BP}px;width:${r.w + BP * 2}px;height:${r.h + BP * 2}px"></div>`).join('');
    // 번호는 박스 왼쪽 위 기준(.ag-num 이 -50%,-50% 이동하므로 좌표는 '중심').
    const nums = rows.map((r) => {
      const bx = IX + r.x - BP, by = r.y - BP;
      const p = NUM.place === 'outside'
        ? { x: bx - NUM.gap - NUM.w / 2, y: by + NUM.w / 2 }   // 박스 왼쪽 바깥, 위 정렬
        : { x: bx, y: by };                                    // 왼쪽 위 모서리 중심
      return `<div class="ag-num" style="left:${Math.round(p.x)}px;top:${Math.round(p.y)}px">${r.n}</div>`;
    }).join('');
    // 연결선: 박스 오른쪽 바깥 변 → 콜아웃 왼쪽 변. 양끝이 수평으로 붙는 S자 곡선.
    const stageH = Math.max(IH, cy), stageW = CX + CW;
    // 끝점 y 는 콜아웃의 '실제' 세로 중심이라야 한다. 여기서는 추정 높이로 한 번 그리고,
    // DOM 에 올라간 뒤 fixWires() 가 실측값으로 다시 그린다(estH 는 한글에서 잘 틀린다).
    const paths = rows.map((r, i) => {
      const c = Math.round(r.y + r.h / 2);
      const sx = Math.min(IX + r.x + r.w + BP, MID - 12), cc = Math.round(r.ct + r.ch / 2);
      const k = Math.max(30, (CX - sx) * 0.45);
      return `<path data-i="${i}" data-sx="${sx}" data-c="${c}" data-ex="${CX}"`
        + ` d="M${sx} ${c} C ${sx + k} ${c}, ${CX - k} ${cc}, ${CX} ${cc}"/>`;
    }).join('');
    const wires = `<svg class="ag-wire" width="${stageW}" height="${stageH}" viewBox="0 0 ${stageW} ${stageH}">${paths}</svg>`;
    const cos = rows.map((r) => `<div class="ag-co" style="left:${CX}px;top:${r.ct}px;width:${CW}px"><h3>${r.n}. ${esc(r.f.title)}</h3><p>${esc(r.f.desc)}</p></div>`).join('');
    return panelShell(sec, group, gi, stageH, stageW, IX, IW, boxes, nums, wires, cos);
  }

  function belowPanel(sec, group, gi) {
    const { IW, CW, LANE, CPL } = LAYOUT.below;
    const k = IW / group.crop[2], IH = Math.round(group.crop[3] * k);
    const rows = toRows(sec, group, k).sort((a, b) => a.x - b.x);
    const lanes = [];
    rows.forEach((r) => { // 가로로 늘어선 박스 → 아래쪽 레인에 좌→우로 배치, 겹치면 새 레인
      const want = Math.max(0, Math.min(IW - CW, Math.round(r.x + r.w / 2 - CW / 2)));
      r.ch = estH(r.f.desc, CPL);
      let li = 0;
      for (;; li++) { const l = lanes[li] || (lanes[li] = { right: -12, h: 0 }); if (want >= l.right + 12) break; }
      const l = lanes[li];
      r.cx = Math.max(want, l.right + 12); l.right = r.cx + CW; l.h = Math.max(l.h, r.ch); r.lane = li;
    });
    let ly = IH + LANE;
    lanes.forEach((l) => { l.top = ly; ly += l.h + 14; });
    rows.forEach((r) => { r.ct = lanes[r.lane].top; });
    const boxes = rows.map((r) => `<div class="ag-box" style="left:${r.x - BP}px;top:${r.y - BP}px;width:${r.w + BP * 2}px;height:${r.h + BP * 2}px"></div>`).join('');
    const nums = rows.map((r) => `<div class="ag-num" style="left:${r.x - BP}px;top:${r.y - BP}px">${r.n}</div>`).join('');
    const paths = rows.map((r) => {
      const bx = Math.round(r.x + r.w / 2), by = r.y + r.h + BP, cx = r.cx + CW / 2, ct = r.ct;
      const k = Math.max(24, (ct - by) * 0.5);
      return `<path d="M${bx} ${by} C ${bx} ${by + k}, ${cx} ${ct - k}, ${cx} ${ct}"/>`;
    }).join('');
    const wires = `<svg class="ag-wire" width="${IW}" height="${ly}" viewBox="0 0 ${IW} ${ly}">${paths}</svg>`;
    const cos = rows.map((r) => `<div class="ag-co" style="left:${r.cx}px;top:${r.ct}px;width:${CW}px"><h3>${r.n}. ${esc(r.f.title)}</h3><p>${esc(r.f.desc)}</p></div>`).join('');
    return panelShell(sec, group, gi, ly, IW, 0, IW, boxes, nums, wires, cos);
  }

  function panelShell(sec, group, gi, h, stageW, ix, iw, boxes, nums, wires, cos) {
    return `<div class="ag-panel" data-panel="${sec.key}-${gi + 1}">`
      + `<div class="ag-plabel"><span class="ag-pno">${sec.step.slice(-2)}-${gi + 1}</span>${esc(group.label)}</div>`
      + `<div class="ag-stage" style="height:${h}px;width:${stageW}px">`
      + `<div class="ag-img" style="left:${ix}px;width:${iw}px"><img src="${sec.imgBase || ''}${group.img}" alt="">${boxes}</div>`
      + `${nums}${wires}${cos}</div></div>`;
  }

  function renderGuideSection(sec) {
    const panels = sec.g.map((g, gi) => (g.mode === 'below' ? belowPanel(sec, g, gi) : sidePanel(sec, g, gi))).join('');
    return `<div class="ag" data-section="${sec.key}">`
      + `<div class="ag-head"><span class="ag-step">${sec.step}</span><h2>${esc(sec.title)}</h2><p>${esc(sec.sub)}</p></div>`
      + `<div class="ag-panels">${panels}</div></div>`;
  }

  /* 렌더 직후 한 번 호출한다. 콜아웃의 실제 높이를 재서 연결선 끝점을
     '왼쪽 변 세로 중심'에 정확히 맞춘다. side 모드에만 적용(데이터 속성이 있는 path). */
  function fixWires(root) {
    (root || document).querySelectorAll('.ag-panel').forEach((p) => {
      const cos = p.querySelectorAll('.ag-co');
      p.querySelectorAll('.ag-wire path').forEach((path) => {
        if (!path.dataset.sx) return;
        const co = cos[+path.dataset.i];
        if (!co) return;
        const sx = +path.dataset.sx, c = +path.dataset.c, ex = +path.dataset.ex;
        const ey = Math.round(co.offsetTop + co.offsetHeight / 2);
        const k = Math.max(30, (ex - sx) * 0.45);
        path.setAttribute('d', `M${sx} ${c} C ${sx + k} ${c}, ${ex - k} ${ey}, ${ex} ${ey}`);
      });
    });
  }

  global.renderGuideSection = renderGuideSection;
  global.AG_fixWires = fixWires;
  global.AG_LAYOUT = LAYOUT;
  global.AG_NUM = NUM;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>document.getElementById("root").innerHTML=renderGuideSection({"key": "s1", "id": "sec1-docselect.png", "x0": 460, "y0": 158, "cw": 810, "ch": 510, "step": "SECTION 01", "title": "서류 선택", "sub": "신청할 갑지 서류를 고르는 단계입니다", "f": [{"x": 28, "y": 122.5, "b": [24, 88, 508, 69], "title": "자동 선택 안내", "desc": "설치·허가 서류를 선택하면 해당 시설의 가동·사용개시 서류가 함께 선택됩니다. 필요 없으면 선택을 해제하세요."}, {"x": 28, "y": 183, "b": [24, 166, 508, 34], "title": "서류 검색", "desc": "서류 이름을 입력해 원하는 서류를 바로 찾으세요."}, {"x": 28, "y": 237, "b": [24, 208, 508, 58], "title": "분야 필터", "desc": "대기·폐수·소음 등 분야별로 목록을 좁혀 보세요. 숫자는 해당 분야에서 선택한 서류 수입니다."}, {"x": 487, "y": 278.5, "b": [483, 270, 50, 17], "title": "서류 목록 펼치기", "desc": "[모두 펼치기]로 검색된 서류 전체를 한 번에 확인하세요."}, {"x": 464, "y": 320, "b": [460, 310, 72, 20], "title": "시설군 단위 선택", "desc": "시설군 오른쪽 [전체 선택]으로 해당 시설의 서류를 한 번에 담으세요."}, {"x": 41, "y": 406, "b": [37, 338, 482, 136], "title": "서류 체크", "desc": "신청할 서류를 체크하세요. 여러 종을 동시에 선택할 수 있습니다."}, {"x": 551, "y": 148, "b": [547, 88, 240, 120], "title": "선택한 서류 확인", "desc": "담은 서류가 시설군별로 정리됩니다. ×로 개별 해제, [전체 해제]로 모두 지우세요."}, {"x": 551, "y": 235.5, "b": [547, 219, 240, 33], "title": "예상 금액", "desc": "선택한 종수에 따라 금액이 자동 계산됩니다."}, {"x": 563, "y": 276.5, "b": [559, 262, 208, 29], "title": "다음 단계로", "desc": "서류를 모두 골랐으면 [사업장 정보 입력]을 눌러 다음 섹션으로 이동하세요."}], "g": [{"f": [0, 1, 2], "mode": "side", "label": "안내 · 검색 · 필터", "crop": [0, 74, 810, 206], "img": "grp-s1-1.png"}, {"f": [3, 4, 5], "mode": "side", "label": "목록에서 서류 담기", "crop": [0, 256, 810, 232], "img": "grp-s1-2.png"}, {"f": [6, 7, 8], "mode": "side", "label": "선택 결과 확인 · 다음 단계", "crop": [0, 74, 810, 231], "img": "grp-s1-3.png"}], "imgBase": "file:///D:/dev/tools/인허가 서대리_미리보기 페이지 작성/갑지/자료/화면캡처/annotate/handoff/img/"});if(window.AG_fixWires)AG_fixWires();</script>
</body></html>
