<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><style>/* annotation-guide.css · 서류 폼 입력 안내(2안: 주황 박스 + 화살표 + 콜아웃) */
/* 폰트: Pretendard Variable 권장. 없으면 시스템 산세리프로 폴백. */

.ag{--ag-ink:#0f172a;--ag-sub:#5b6779;--ag-line:#e2e8f0;--ag-edge:#C9D6EC;--ag-accent:#ea580c;--ag-accent-ink:#9a3412;--ag-accent-line:#fcd9bd;--ag-accent-chip:#fff3ea;
  /* 강조 계열 투명도는 여기서만 조절한다 */
  --ag-box-line:rgba(234,88,12,.45);        /* 박스 테두리 */
  --ag-fill-a:rgba(234,88,12,.055);         /* 박스 필 · 왼쪽 */
  --ag-fill-b:rgba(234,88,12,.005);         /* 〃 오른쪽(거의 투명) */
  --ag-glow:rgba(234,88,12,.20);            /* 테두리 바깥으로 번지는 빛 */
  --ag-wire:rgba(234,88,12,.50);            /* 연결 점선 */
  /* 주황은 박스·번호·지시선·설명박스에만 쓴다. 나머지 UI 는 원문 화면의 파랑을 따른다. */
  --ag-blue:#2B62EF;                        /* 원문 주 버튼 파랑 */
  --ag-blue-ink:#1E4FD0;                    /* 글자용 · 한 단계 짙게 */
  --ag-blue-chip:#EAF0FE;                   /* 스카이 블루 칩 배경 */
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ag-ink);position:relative;width:1010px;background:#fff;border:1px solid var(--ag-edge);border-radius:20px;overflow:hidden}

/* 카드 헤더 */
.ag-head{padding:22px 30px 20px;border-bottom:1px solid var(--ag-line);display:flex;align-items:baseline;gap:12px}
.ag-step{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ag-blue)}
.ag-head h2{margin:0;font-size:21px;letter-spacing:-.02em}
.ag-head p{margin:0;font-size:13px;color:var(--ag-sub)}

/* 패널(= 섹션을 2~3개 항목 단위로 쪼갠 블록) */
.ag-panels{padding:8px 30px 30px}
.ag-panel{padding:22px 0 26px;border-top:1px solid #f1f5f9}
.ag-panel:first-child{border-top:0}
.ag-plabel{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:12.5px;font-weight:700;color:var(--ag-blue-ink)}
.ag-pno{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--ag-blue-ink);background:var(--ag-blue-chip);border-radius:5px;padding:2px 7px}

/* 스테이지: 스크린샷 + 박스 + 화살표 + 콜아웃을 절대좌표로 얹는 좌표계 */
.ag-stage{position:relative}
.ag-img{position:absolute;left:0;top:0}
.ag-img img{display:block;width:100%;border:1px solid var(--ag-line);border-radius:8px}

/* 강조 박스 · 번호 */
/* box-sizing 을 반드시 border-box 로. 없으면 2px 테두리가 밖으로 더해져
   박스 오른쪽·아래가 4px 씩 커지고, 연결선이 박스 안으로 파고든다. */
/* 바깥으로는 단단한 링 대신 blur 로 번지게 해서 경계가 투명하게 사라지도록 한다.
   0 0 9px 1px = 테두리에서 1px 벌린 뒤 9px 에 걸쳐 서서히 사라짐. */
.ag-box{position:absolute;box-sizing:border-box;border:1px solid var(--ag-box-line);border-radius:6px;
  background:linear-gradient(95deg,var(--ag-fill-a),var(--ag-fill-b));
  box-shadow:0 0 9px 1px var(--ag-glow)}
/* 번호는 알약이 아니라 **정원**. 좌우 패딩이 없어 자리를 덜 차지한다. */
.ag-panels{position:relative}
.ag-flow{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.ag-flow path{fill:none;stroke:var(--ag-accent);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.ag-flow polygon{fill:var(--ag-accent)}
.ag-flowlab{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:12px;font-weight:700;color:var(--ag-accent-ink);background:#fff;border:1px solid var(--ag-accent-line);border-radius:8px;padding:5px 10px;box-shadow:0 2px 6px rgba(124,45,18,.07)}
.ag-dot{position:absolute;transform:translate(-50%,-50%);width:15px;height:15px;line-height:0}
.ag-dot svg{width:15px;height:15px;overflow:visible}
.ag-dot .h{fill:none;stroke:#fff;stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
.ag-dot .c{fill:none;stroke:var(--ag-accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ag-num{position:absolute;transform:translate(-50%,-50%);width:16px;height:16px;padding:0;border-radius:50%;background:var(--ag-accent);color:#fff;font-size:9.5px;font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1.5px #fff}

/* 연결선 · 화살촉 없이 얇은 점선 곡선. 꺾인 직선 대신 3차 베지어 한 획. */
.ag-wire{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.ag-wire path{fill:none;stroke:var(--ag-wire);stroke-width:1;stroke-dasharray:3 4;stroke-linecap:round}

/* 설명 콜아웃 */
.ag-co{position:absolute;background:#fff;border:1px solid var(--ag-accent-line);border-radius:9px;padding:9px 12px;box-shadow:0 2px 6px rgba(124,45,18,.07)}
.ag-co h3{margin:0 0 3px;font-size:12.5px;font-weight:700;letter-spacing:-.01em;color:var(--ag-accent-ink)}
.ag-co p{margin:0;font-size:12px;line-height:1.55;color:var(--ag-sub);text-wrap:pretty}

.ag{width:1440px}
.ag-head{padding:24px 30px 22px}
.ag-head h2{font-size:22px}

.ag-docs{display:flex;flex-wrap:wrap;gap:26px 22px;justify-content:center}
.ag-doc{width:444px}
.ag-doc .t{font-size:12.5px;font-weight:700;color:var(--ag-blue-ink);margin-bottom:8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-doc .s{border:1px solid var(--ag-line);border-radius:10px;overflow:hidden;background:#fff;
  box-shadow:0 8px 20px -12px rgba(20,45,110,.30)}
.ag-doc .s img{display:block;width:100%}
.ag-note{display:flex;justify-content:center;margin-top:28px}
.ag-note span{font-size:12.5px;font-weight:700;color:var(--ag-accent-ink);background:#fff;
  border:1px solid var(--ag-accent-line);border-radius:9px;padding:8px 14px;
  box-shadow:0 2px 6px rgba(124,45,18,.07)}
