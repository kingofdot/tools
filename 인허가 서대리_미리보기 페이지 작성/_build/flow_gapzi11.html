<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#FFFFFF}
  .sheet{position:relative;width:1490px;height:1420px;padding:30px}
  .main{position:absolute;left:30px;top:120px;width:1425px}
  .main img{display:block;width:1425px;border:1px solid #E1E8F4;border-radius:12px;background:#fff}
  .side{position:absolute}
  .side img{display:block;border:1px solid #D8E0EE;border-radius:12px;
    box-shadow:0 14px 32px -14px rgba(20,45,110,.26);background:#fff}
  .tag{position:absolute;font-size:16px;font-weight:800;color:#1E51D5}
  .ov{position:absolute;inset:0;pointer-events:none}
  .hl{position:absolute;border:2.2px solid #F5820A;border-radius:9px;
    box-shadow:0 0 6px rgba(245,130,10,.35), 0 0 15px 1px rgba(245,130,10,.16)}
  .cap{position:absolute;font-weight:700;font-size:16px;white-space:nowrap;
    padding:8px 14px;border-radius:10px;color:#F5820A;background:#FFFFFF;
    border:1.6px solid #F5820A;
    box-shadow:0 0 6px rgba(245,130,10,.35), 0 0 15px 1px rgba(245,130,10,.16)}
</style></head><body>
<div class="sheet">

  <div class="main"><img src="../자료/갑지생성자료/갑지생성11.png" alt=""></div>

  <div class="tag" style="left:30px;top:846px">함께 확인하는 항목</div>
  <div class="side" style="left:30px;top:878px"><img src="../자료/갑지생성자료/갑지생성11-1.png" style="width:633px"></div>
  <div class="side" style="left:706px;top:878px"><img src="../자료/갑지생성자료/갑지생성11-2.png" style="width:626px"></div>

  <!-- 무료로 서류 생성 버튼: 원본 x1085~1404, y109~148 → 화면 +31/+121 -->
  <div class="hl" style="left:1109.8px;top:223.8px;width:333.4px;height:54.4px"></div>

  <svg class="ov" viewBox="0 0 1490 1420" fill="none">
    <defs>
      <marker id="a11" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
        <path d="M1 1.2 L7.5 4.5 L1 7.8 Z" fill="#F5820A"/>
      </marker>
    </defs>
    <!-- 버튼 → 위쪽 라벨 -->
    <path d="M1276 221 L1276 170 L1230 170" stroke="#F5820A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 버튼 → 아래(생성·다운로드 흐름) -->
    <path d="M1276 281 L1276 430" stroke="#F5820A" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#a11)"/>
    <!-- 입력 내용 확인 영역 앵커 -->
    <circle cx="510" cy="258" r="7" fill="#F5820A" opacity="0.20"/><circle cx="510" cy="258" r="4" fill="#F5820A"/>
    <path d="M510 258 L475 300 L420 300" stroke="#F5820A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="cap" style="left:420px;top:300px;transform:translate(-100%,-50%)">입력하신 내용을 마지막으로 확인합니다</div>
  <div class="cap" style="left:1230px;top:170px;transform:translate(-100%,-50%)">베타 기간에는 결제 없이 무료로 생성됩니다</div>
  <div class="cap" style="left:1276px;top:455px;transform:translate(-50%,-50%)">누르면 서류가 만들어지고 바로 다운로드할 수 있습니다</div>
</div>
</body></html>
