<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="design.css">
</head><body>
<div class="card"><div class="pad">

  <div class="brandbar">
    <span class="dot">서</span>
    <span>인허가 서대리</span>
    <span class="sep">·</span>
    <span class="muted">서류 만들기</span>
  </div>

  <div class="mt-l"></div>
  <span class="eyebrow">클릭 몇 번으로 끝나는 환경 서류</span>

  <h1 class="h1 mt-m">복잡한 환경 인허가 서류,<br><span class="grad">서대리가 대신 씁니다</span></h1>

  <p class="lead mt-m">운영일지 · 관리대장 · 질의회신까지,<br>
  사업장 정보만 입력하면 서류가 자동으로 완성됩니다.</p>

  <!-- 3스텝 -->
  <div class="steps">
    <div class="step">
      <div class="iconbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M4.268 21a2 2 0 0 0 1.727 1H18a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v3"/><path d="m9 18-1.5-1.5"/><circle cx="5" cy="14" r="3"/></svg></div>
      <div class="num">STEP 1</div>
      <div class="st">자료 입력 · 검색</div>
      <div class="sd">필요한 서식과 항목을 골라 기본 정보를 넣습니다.</div>
    </div>
    <div class="arrow">›</div>
    <div class="step">
      <div class="iconbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M12 6h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/><path d="M8 6h.01"/><path d="M9 22v-3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/><rect x="4" y="2" width="16" height="20" rx="2"/></svg></div>
      <div class="num">STEP 2</div>
      <div class="st">사업장 정보 반영</div>
      <div class="sd">사업장 · 시설 정보를 서식에 맞게 자동 채워 넣습니다.</div>
    </div>
    <div class="arrow">›</div>
    <div class="step">
      <div class="iconbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg></div>
      <div class="num">STEP 3</div>
      <div class="st">완성 서류 다운로드</div>
      <div class="sd">바로 제출 가능한 서류를 파일로 내려받습니다.</div>
    </div>
  </div>

  <div class="row mt-l" style="align-items:center">
    <span class="btn">미리보기 시작하기 <span style="font-size:26px;line-height:0">→</span></span>
    <span class="small">가입 없이 샘플을 먼저 확인해 보세요.</span>
  </div>

</div></div>
</body></html>
