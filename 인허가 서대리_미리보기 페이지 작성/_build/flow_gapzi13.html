<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#FFFFFF}
  .sheet{position:relative;width:1028px;padding:28px 30px 30px}
  .grid{display:flex;flex-wrap:wrap;justify-content:center;gap:26px 22px}
  .doc{width:308px}
  .doc .tag{font-size:15px;font-weight:800;color:#1E51D5;margin-bottom:9px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .doc .shot{border:1px solid #E1E8F4;border-radius:12px;overflow:hidden;background:#fff;
    box-shadow:0 10px 22px -12px rgba(20,45,110,.28)}
  .doc .shot img{display:block;width:100%}
  .foot{display:flex;justify-content:center;margin-top:30px}
  .cap{font-weight:700;font-size:16px;white-space:nowrap;
    padding:8px 14px;border-radius:10px;color:#F5820A;background:#FFFFFF;
    border:1.6px solid #F5820A;
    box-shadow:0 0 6px rgba(245,130,10,.35), 0 0 15px 1px rgba(245,130,10,.16)}
</style></head><body>
<div class="sheet">

  <div class="grid">
    <div class="doc"><div class="tag">대기배출시설 설치신고</div>
      <div class="shot"><img src="../결과물/%EC%98%88%EC%8B%9C1_%EB%8C%80%EA%B8%B0%EB%B0%B0%EC%B6%9C%EC%8B%9C%EC%84%A4%20%EC%84%A4%EC%B9%98%EC%8B%A0%EA%B3%A0.png" alt=""></div></div>
    <div class="doc"><div class="tag">폐수배출시설 설치신고</div>
      <div class="shot"><img src="../결과물/%EC%98%88%EC%8B%9C5_%ED%8F%90%EC%88%98%EB%B0%B0%EC%B6%9C%EC%8B%9C%EC%84%A4%20%EC%84%A4%EC%B9%98%EC%8B%A0%EA%B3%A0.png" alt=""></div></div>
    <div class="doc"><div class="tag">소음·진동배출시설 설치신고</div>
      <div class="shot"><img src="../결과물/%EC%98%88%EC%8B%9C3_%EC%86%8C%EC%9D%8C%EC%A7%84%EB%8F%99%EB%B0%B0%EC%B6%9C%EC%8B%9C%EC%84%A4%20%EC%84%A4%EC%B9%98%EC%8B%A0%EA%B3%A0.png" alt=""></div></div>
    <div class="doc"><div class="tag">사업장폐기물배출자 신고</div>

      <div class="shot"><img src="../결과물/%EC%98%88%EC%8B%9C4_%ED%8F%90%EA%B8%B0%EB%AC%BC%EC%A4%91%EA%B0%84%EC%9E%AC%ED%99%9C%EC%9A%A9%EC%97%85%20%ED%97%88%EA%B0%80%EC%8B%A0%EC%B2%AD.png" alt=""></div></div>

</body></html>
