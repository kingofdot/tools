<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#FFFFFF}
  .sheet{position:relative;width:1065px;height:352px;padding:26px 30px}
  .main{position:absolute;left:30px;top:30px;width:1005px}
  .main img{display:block;width:1005px;border:1px solid #E1E8F4;border-radius:12px;background:#fff}
  .ov{position:absolute;inset:0;pointer-events:none}
  .cap{position:absolute;font-weight:700;font-size:16px;white-space:nowrap;
    padding:8px 14px;border-radius:10px;color:#F5820A;background:#FFFFFF;
    border:1.6px solid #F5820A;
    box-shadow:0 0 6px rgba(245,130,10,.35), 0 0 15px 1px rgba(245,130,10,.16)}
</style></head><body>
<div class="sheet">
  <div class="main"><img src="../자료/갑지생성자료/갑지생성8.png" alt=""></div>

  <svg class="ov" viewBox="0 0 1065 352" fill="none">
    <!-- 3개 단위 버튼 앵커(글씨 우측) : 원본 y149 → 화면 y = 30+1+149 = 180 -->
    <circle cx="232" cy="180" r="7" fill="#F5820A" opacity="0.20"/><circle cx="232" cy="180" r="4" fill="#F5820A"/>
    <circle cx="556" cy="180" r="7" fill="#F5820A" opacity="0.20"/><circle cx="556" cy="180" r="4" fill="#F5820A"/>
    <circle cx="878" cy="180" r="7" fill="#F5820A" opacity="0.20"/><circle cx="878" cy="180" r="4" fill="#F5820A"/>
    <!-- 각 앵커 → 위쪽 공통 라벨(좌·우는 곡선, 가운데는 직선) -->
    <path d="M232 180 C 232 148, 268 108, 470 108" stroke="#F5820A" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M556 180 L556 108" stroke="#F5820A" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M878 180 C 878 148, 842 108, 640 108" stroke="#F5820A" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 제출일 앵커 + 리더선(우하) : 원본 y252 → 화면 y = 283 -->
    <circle cx="205" cy="283" r="7" fill="#F5820A" opacity="0.20"/><circle cx="205" cy="283" r="4" fill="#F5820A"/>
    <path d="M205 283 L240 313 L286 313" stroke="#F5820A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="cap" style="left:555px;top:108px;transform:translate(-50%,-50%)">셋 중 서류에 기재할 단위를 하나 고릅니다</div>
  <div class="cap" style="left:286px;top:313px;transform:translateY(-50%)">고른 단위에 맞춰 제출 시점을 입력합니다</div>
</div>
</body></html>
