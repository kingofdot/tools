<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#FFFFFF}
  .sheet{position:relative;width:1500px;height:360px}
  .main{position:absolute;left:70px;top:150px;width:1346px}
  .main img{display:block;width:1346px;border:1px solid #E1E8F4;border-radius:12px;background:#fff}
  .ov{position:absolute;inset:0;pointer-events:none}
  .hl{position:absolute;border:2.2px solid #F5820A;border-radius:9px;
    box-shadow:0 0 6px rgba(245,130,10,.35), 0 0 15px 1px rgba(245,130,10,.16)}
  .cap{position:absolute;font-weight:700;font-size:16px;white-space:nowrap;
    padding:8px 14px;border-radius:10px;color:#F5820A;background:#FFFFFF;
    border:1.6px solid #F5820A;
    box-shadow:0 0 6px rgba(245,130,10,.35), 0 0 15px 1px rgba(245,130,10,.16)}
</style></head><body>
<div class="sheet">
  <div class="main"><img src="../자료/갑지생성자료/갑지생성10.png" alt=""></div>

  <!-- 100% 진행률 / 서류 생성 버튼 -->
  <div class="hl" style="left:74px;top:164px;width:470px;height:73px"></div>
  <div class="hl" style="left:1243.8px;top:164.6px;width:122.4px;height:56.4px"></div>

  <svg class="ov" viewBox="0 0 1500 360" fill="none">
    <defs>
      <marker id="a10" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
        <path d="M1 1.2 L7.5 4.5 L1 7.8 Z" fill="#F5820A"/>
      </marker>
    </defs>
    <!-- 100% → 위쪽 라벨 -->
    <path d="M170 162 L170 118 L214 118" stroke="#F5820A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 서류 생성 → 위쪽 라벨 -->
    <path d="M1305 164 L1305 118 L1262 118" stroke="#F5820A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 다음 화면으로 넘어감(아래 방향) -->
    <path d="M1305 221 L1305 300" stroke="#F5820A" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#a10)"/>
  </svg>

  <div class="cap" style="left:214px;top:118px;transform:translateY(-50%)">모든 항목을 채우면 100%가 됩니다</div>
  <div class="cap" style="left:1262px;top:118px;transform:translate(-100%,-50%)">100%가 되면 서류 생성 버튼이 켜집니다</div>
  <div class="cap" style="left:1305px;top:322px;transform:translate(-50%,-50%)">최종 확인 화면으로 넘어갑니다</div>
</div>
</body></html>
