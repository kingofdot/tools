<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><style>
  :root{
    --ink:#0F172A; --muted:#64748B; --edge:#E5EAF2;
    --accent:#EA580C; --accent-15:rgba(234,88,12,.15); --accent-30:rgba(234,88,12,.30);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#FFFFFF;
    -webkit-font-smoothing:antialiased}
  .sheet{position:relative;width:2077px;height:1056px;padding:40px}

  /* 화면: 얇은 테두리 + 낮고 넓은 그림자로 살짝 띄운다 */
  .main{position:absolute;left:40px;top:40px;width:1549px;height:976px;
    overflow:hidden;border:1px solid var(--edge);border-radius:14px;background:#fff;
    box-shadow:0 18px 40px -26px rgba(15,23,42,.28), 0 1px 3px rgba(15,23,42,.04)}
  .main img{display:block;width:1549px;margin:-0px 0 0 -0px}

  /* 강조: 글로우 대신 포커스 링 */
  .hl{position:absolute;border:1.5px solid var(--accent);border-radius:7px;
    box-shadow:0 0 0 3px var(--accent-15)}

  .ov{position:absolute;inset:0;pointer-events:none}

  /* 레일 */
  .rail{position:absolute}
  .rail .no{position:absolute;left:0;top:0;width:23px;height:23px;border-radius:50%;
    background:var(--accent);color:#fff;font-size:12px;font-weight:800;
    display:flex;align-items:center;justify-content:center;letter-spacing:-.2px}
  .rail .tx{margin-left:35px}
  .rail .t{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.3px;line-height:1.35}
  .rail .d{margin-top:4px;font-size:14.5px;color:var(--muted);line-height:1.5}
</style></head><body>
<div class="sheet">
  <div class="main"><img src="../갑지/자료/화면캡처/test_컷/test_2.png" alt=""></div>

  <div class="hl" style="left:107px;top:727px;width:462px;height:60px"></div>
  <div class="hl" style="left:577px;top:727px;width:462px;height:60px"></div>
  <div class="hl" style="left:1101px;top:213px;width:450px;height:260px"></div>
  <div class="hl" style="left:1101px;top:473px;width:450px;height:44px"></div>
  <div class="hl" style="left:1121px;top:547px;width:406px;height:50px"></div>

  <svg class="ov" viewBox="0 0 2077 1056" fill="none">
    <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4"
      orient="auto"><path d="M1 1.3 L6.8 4 L1 6.7 Z" fill="var(--accent)"/></marker></defs>
    <path d="M 559 716 C 720 716, 900 470, 1054 320" stroke="var(--accent)" stroke-width="1.4" stroke-opacity=".55" stroke-linecap="round" marker-end="url(#ar)"/>
    <path d="M 1029 716 C 1050 690, 1054 500, 1054 396" stroke="var(--accent)" stroke-width="1.4" stroke-opacity=".55" stroke-linecap="round" marker-end="url(#ar)"/>
    <path d="M1551 495 C 1594 495, 1594 483, 1630 483" stroke="var(--accent)" stroke-width="1.4" stroke-opacity=".5" stroke-linecap="round"/>
    <circle cx="1551" cy="495" r="3.6" fill="var(--accent)"/><circle cx="1551" cy="495" r="7" fill="none" stroke="var(--accent)" stroke-opacity=".28" stroke-width="1.4"/>
    <path d="M1527 572 C 1583 572, 1583 560, 1630 560" stroke="var(--accent)" stroke-width="1.4" stroke-opacity=".5" stroke-linecap="round"/>
    <circle cx="1527" cy="572" r="3.6" fill="var(--accent)"/><circle cx="1527" cy="572" r="7" fill="none" stroke="var(--accent)" stroke-opacity=".28" stroke-width="1.4"/>
    <path d="M1039 757 C 1364 757, 1364 745, 1630 745" stroke="var(--accent)" stroke-width="1.4" stroke-opacity=".5" stroke-linecap="round"/>
    <circle cx="1039" cy="757" r="3.6" fill="var(--accent)"/><circle cx="1039" cy="757" r="7" fill="none" stroke="var(--accent)" stroke-opacity=".28" stroke-width="1.4"/>
  </svg>

  <div class="rail" style="left:1645px;top:472px;width:392px">
    <div class="no">1</div><div class="tx"><div class="t">예상 금액이 함께 계산</div><div class="d">고른 개수에 따라 금액이 달라집니다</div></div>
  </div>
  <div class="rail" style="left:1645px;top:549px;width:392px">
    <div class="no">2</div><div class="tx"><div class="t">다음 단계로</div><div class="d">사업장 정보 입력 화면으로 넘어갑니다</div></div>
  </div>

    <div class="no">3</div><div class="tx"><div class="t">체크하면 바로 담깁니다</div><div class="d">고른 서류가 오른쪽 목록에 쌓입니다</div></div>
  </div>
</div>
</body></html>
