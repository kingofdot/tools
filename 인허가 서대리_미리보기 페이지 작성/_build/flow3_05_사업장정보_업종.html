<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><style>
  :root{
    --ink:#0F172A; --muted:#64748B; --edge:#E5EAF2;
    --accent:#EA580C; --accent-15:rgba(234,88,12,.15); --accent-30:rgba(234,88,12,.30);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#FFFFFF;
    -webkit-font-smoothing:antialiased}
  .sheet{position:relative;width:2077px;height:380px;padding:40px}

  /* 화면: 얇은 테두리 + 낮고 넓은 그림자로 살짝 띄운다 */
  .main{position:absolute;left:40px;top:40px;width:1549px;height:300px;
    overflow:hidden;border:1px solid var(--edge);border-radius:14px;background:#fff;
    box-shadow:0 18px 40px -26px rgba(15,23,42,.28), 0 1px 3px rgba(15,23,42,.04)}
  .main img{display:block;width:1549px;margin:-1530px 0 0 -0px}

  /* 강조: 글로우 대신 포커스 링 */
  .hl{position:absolute;border:1.5px solid var(--accent);border-radius:7px;
    box-shadow:0 0 0 3px var(--accent-15)}

  .ov{position:absolute;inset:0;pointer-events:none}

  /* 레일 */
  .rail{position:absolute}
  .rail .no{position:absolute;left:0;top:0;width:23px;height:23px;border-radius:50%;
    background:var(--accent);color:#fff;font-size:12px;font-weight:800;
    display:flex;align-items:center;justify-content:center;letter-spacing:-.2px}
  .rail .tx{margin-left:35px}
  .rail .t{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.3px;line-height:1.35}
  .rail .d{margin-top:4px;font-size:14.5px;color:var(--muted);line-height:1.5}
</style></head><body>
<div class="sheet">
  <div class="main"><img src="../갑지/자료/화면캡처/test_컷/test_3.png" alt=""></div>

  <div class="hl" style="left:1441px;top:66px;width:100px;height:22px"></div>
  <div class="hl" style="left:96px;top:211px;width:565px;height:45px"></div>
  <div class="hl" style="left:686px;top:211px;width:845px;height:45px"></div>

  <svg class="ov" viewBox="0 0 2077 380" fill="none">
    <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4"
      orient="auto"><path d="M1 1.3 L6.8 4 L1 6.7 Z" fill="var(--accent)"/></marker></defs>
    <path d="M1541 77 C 1589 77, 1589 65, 1630 65" stroke="var(--accent)" stroke-width="1.4" stroke-opacity=".5" stroke-linecap="round"/>
    <circle cx="1541" cy="77" r="3.6" fill="var(--accent)"/><circle cx="1541" cy="77" r="7" fill="none" stroke="var(--accent)" stroke-opacity=".28" stroke-width="1.4"/>
    <path d="M661 233 C 1193 233, 1193 221, 1630 221" stroke="var(--accent)" stroke-width="1.4" stroke-opacity=".5" stroke-linecap="round"/>
    <circle cx="661" cy="233" r="3.6" fill="var(--accent)"/><circle cx="661" cy="233" r="7" fill="none" stroke="var(--accent)" stroke-opacity=".28" stroke-width="1.4"/>
    <path d="M1531 233 C 1585 233, 1585 297, 1630 297" stroke="var(--accent)" stroke-width="1.4" stroke-opacity=".5" stroke-linecap="round"/>
    <circle cx="1531" cy="233" r="3.6" fill="var(--accent)"/><circle cx="1531" cy="233" r="7" fill="none" stroke="var(--accent)" stroke-opacity=".28" stroke-width="1.4"/>
  </svg>

  <div class="rail" style="left:1645px;top:54px;width:392px">
    <div class="no">1</div><div class="tx"><div class="t">업종 추가</div><div class="d">업종이 여러 개면 칸을 늘릴 수 있습니다</div></div>
  </div>
  <div class="rail" style="left:1645px;top:210px;width:392px">
    <div class="no">2</div><div class="tx"><div class="t">분류코드</div><div class="d">한국표준산업분류 11차 코드를 넣습니다</div></div>
  </div>
  <div class="rail" style="left:1645px;top:286px;width:392px">
    <div class="no">3</div><div class="tx"><div class="t">분류명</div><div class="d">코드를 넣으면 나머지 한 칸이 자동으로 채워집니다</div></div>
  </div>
</div>
</body></html>
