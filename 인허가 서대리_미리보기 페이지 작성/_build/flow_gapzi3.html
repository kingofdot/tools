<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Malgun Gothic','맑은 고딕',sans-serif}
  .wrap{position:relative;width:1016px;height:678px}
  /* 원본 PNG는 그대로 두고 CSS로만 좌측 사이드바와 좌우 여백을 잘라낸다 */
  .clip{width:1016px;height:678px;overflow:hidden}
  .clip img{display:block;width:1294px;height:678px;margin-left:-252px}
  .ov{position:absolute;inset:0;pointer-events:none}
  .hl{position:absolute;border:2.2px solid #F5820A;border-radius:10px;
    box-shadow:0 0 6px rgba(245,130,10,.35), 0 0 15px 1px rgba(245,130,10,.16)}
  .cap{position:absolute;font-weight:700;font-size:17px;white-space:nowrap;
    padding:9px 15px;border-radius:11px;color:#F5820A;background:#FFFFFF;
    border:1.6px solid #F5820A;
    box-shadow:0 0 6px rgba(245,130,10,.35), 0 0 15px 1px rgba(245,130,10,.16)}
</style></head><body>
<div class="wrap">
  <div class="clip"><img src="../자료/갑지생성자료/갑지생성3.png" alt=""></div>

  <!-- 검색창 -->
  <div class="hl" style="left:24px;top:230px;width:661px;height:44px"></div>
  <!-- 필터된 결과 카드 -->
  <div class="hl" style="left:24px;top:395px;width:659px;height:245px"></div>

  <svg class="ov" viewBox="0 0 1016 678" fill="none">
    <defs>
      <marker id="ah3" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
        <path d="M1 1.2 L7.5 4.5 L1 7.8 Z" fill="#F5820A"/>
      </marker>
    </defs>
    <!-- 검색창 → 결과(아래로) -->
    <path d="M354 280 L354 388"
      stroke="#F5820A" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#ah3)"/>
    <!-- 라벨1 리더선(검색창 우측) -->
    <path d="M689 252 L723 252"
      stroke="#F5820A" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 라벨2 리더선(결과 우측) -->
    <path d="M687 470 L723 470"
      stroke="#F5820A" stroke-width="2.2" stroke-linecap="round"/>
  </svg>

  <div class="cap" style="left:723px;top:252px;transform:translateY(-50%)">서류 이름을 입력하면</div>
  <div class="cap" style="left:723px;top:470px;transform:translateY(-50%)">관련 서류만 바로 걸러집니다</div>
</div>
</body></html>
