<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#FFFFFF}
  .sheet{position:relative;width:1660px;height:700px;padding:28px 30px}
  .main{position:absolute;left:30px;top:28px;width:1011px}
  .main img{display:block;width:1011px;border:1px solid #E1E8F4;border-radius:12px;background:#fff}
  /* _popup7.png 에는 진한 회색 테두리가 구워져 있고 두께도 변(위2·우1·하1·좌0)마다 다르다.
     원본은 두지 않고 사방 3px 을 잘라낸 뒤, 다른 컷과 같은 테두리를 CSS 로 입힌다. */
  .pop{position:absolute;left:1096px;top:150px;width:507px}
  .pop .clip{width:507px;height:155px;overflow:hidden;background:#fff;
    border:1px solid #E1E8F4;border-radius:12px;
    box-shadow:0 16px 38px -14px rgba(20,45,110,.30)}
  .pop .clip img{display:block;width:513px;margin:-3px 0 0 -3px}
  .poptag{position:absolute;left:1096px;top:114px;font-size:16px;font-weight:800;color:#1E51D5}
  .ov{position:absolute;inset:0;pointer-events:none}
  .hl{position:absolute;border:2.2px solid #F5820A;border-radius:9px;
    box-shadow:0 0 6px rgba(245,130,10,.35), 0 0 15px 1px rgba(245,130,10,.16)}
  .cap{position:absolute;font-weight:700;font-size:16px;white-space:nowrap;
    padding:8px 14px;border-radius:10px;color:#F5820A;background:#FFFFFF;
    border:1.6px solid #F5820A;
    box-shadow:0 0 6px rgba(245,130,10,.35), 0 0 15px 1px rgba(245,130,10,.16)}
</style></head><body>
<div class="sheet">

  <div class="main"><img src="../자료/갑지생성자료/갑지생성7.png" alt=""></div>
  <div class="poptag">첫 제출청을 입력하면 나오는 확인 창</div>
  <div class="pop"><div class="clip"><img src="../자료/갑지생성자료/_popup7.png" alt=""></div></div>

  <!-- 첫 제출청 필드 / 나머지 3건 -->
  <div class="hl" style="left:109px;top:193px;width:902px;height:41px"></div>
  <div class="hl" style="left:109px;top:329px;width:902px;height:313px"></div>

  <svg class="ov" viewBox="0 0 1660 700" fill="none">
    <defs>
      <marker id="a7" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
        <path d="M1 1.2 L7.5 4.5 L1 7.8 Z" fill="#F5820A"/>
      </marker>
    </defs>
    <!-- 첫 필드 → 팝업 -->
    <path d="M1015 213 C 1050 213, 1060 226, 1090 240"
      stroke="#F5820A" stroke-width="2.4" stroke-linecap="round" marker-end="url(#a7)"/>
    <!-- 팝업 확인 → 아래 서류들 일괄 적용 -->
    <path d="M1096 300 C 1050 330, 1030 380, 1015 440"
      stroke="#F5820A" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#a7)"/>
  </svg>

  <div class="cap" style="left:600px;top:171px;transform:translate(-50%,-50%)">첫 서류의 제출청을 입력합니다</div>
  <div class="cap" style="left:1096px;top:340px;font-size:15px">확인을 누르면 아래 서류에 모두 같은 제출청이 적용됩니다</div>
  <div class="cap" style="left:1096px;top:392px;font-size:15px">제출청이 다르면 취소하고 서류별로 따로 입력해 주세요</div>
</div>
</body></html>
