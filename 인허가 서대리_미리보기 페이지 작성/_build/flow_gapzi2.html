<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Malgun Gothic','맑은 고딕',sans-serif}
  body{background:#F7F9FC}
  .wrap{position:relative;width:1610px;height:650px}
  .wrap img{display:block;width:1300px;height:650px}
  .ov{position:absolute;left:0;top:0;width:1300px;height:650px;pointer-events:none}
  /* 하이라이트 박스(오렌지 링 + 은은한 글로우) */
  .hl{position:absolute;border:2.2px solid #F5820A;border-radius:10px;
    box-shadow:0 0 6px rgba(245,130,10,.35), 0 0 15px 1px rgba(245,130,10,.16)}
  /* 라벨(공통 마커 스타일: 흰 박스 + 주황 글로우) */
  .cap{position:absolute;font-weight:700;font-size:18px;white-space:nowrap;
    padding:9px 15px;border-radius:11px;color:#F5820A;background:#FFFFFF;
    border:1.6px solid #F5820A;
    box-shadow:0 0 6px rgba(245,130,10,.35), 0 0 15px 1px rgba(245,130,10,.16)}
</style></head><body>
<div class="wrap">
  <img src="../자료/갑지생성자료/갑지생성2.png" alt="">

  <!-- 좌: 체크된 서류 2건 -->
  <div class="hl" style="left:302px;top:472px;width:312px;height:47px"></div>
  <div class="hl" style="left:302px;top:579px;width:312px;height:47px"></div>
  <!-- 우: 선택한 서류 패널 -->
  <div class="hl" style="left:972px;top:131px;width:296px;height:160px"></div>

  <svg class="ov" viewBox="0 0 1300 650" fill="none">
    <defs>
      <marker id="ah2" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
        <path d="M1 1.2 L7.5 4.5 L1 7.8 Z" fill="#F5820A"/>
      </marker>
    </defs>
    <!-- 체크1 → 패널(설치신고 항목 바로 앞) -->
    <path d="M620 495 C 760 495, 850 300, 962 228"
      stroke="#F5820A" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah2)" opacity="0.95"/>
    <!-- 체크2 → 패널(가동개시 항목 바로 앞) -->
    <path d="M620 602 C 770 602, 860 350, 962 268"
      stroke="#F5820A" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ah2)" opacity="0.95"/>
    <!-- 사업장 정보 입력 버튼 리더선(점 → 우하 대각 → 수평) -->
    <circle cx="1180" cy="373" r="7" fill="#F5820A" opacity="0.20"/>
    <circle cx="1180" cy="373" r="4" fill="#F5820A"/>
    <path d="M1180 373 L1215 409 L1262 409"
      stroke="#F5820A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <!-- 라벨 -->
  <div class="cap" style="left:636px;top:400px">체크하면 오른쪽에 바로 담깁니다</div>
  <div class="cap" style="left:1262px;top:409px;transform:translateY(-50%);font-size:16px">누르면 사업장 정보 입력 화면으로</div>
</div>
</body></html>
