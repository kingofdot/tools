<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#F7F9FC}
  .sheet{position:relative;width:1520px;height:730px}
  .main{position:absolute;left:170px;top:20px;width:1319px}
  .main img{display:block;width:1319px;border:1px solid #E1E8F4;border-radius:12px;background:#fff}
  .ov{position:absolute;inset:0;pointer-events:none}
  .hl{position:absolute;border:2.2px solid #F5820A;border-radius:9px;
    box-shadow:0 0 6px rgba(245,130,10,.35), 0 0 15px 1px rgba(245,130,10,.16)}
  .cap{position:absolute;font-weight:700;font-size:16px;white-space:nowrap;
    padding:8px 14px;border-radius:10px;color:#F5820A;background:#FFFFFF;
    border:1.6px solid #F5820A;
    box-shadow:0 0 6px rgba(245,130,10,.35), 0 0 15px 1px rgba(245,130,10,.16)}
</style></head><body>
<div class="sheet">
  <div class="main"><img src="../자료/갑지생성자료/갑지생성9.png" alt=""></div>

  <!-- 검증하기 버튼 / 진행률 -->
  <div class="hl" style="left:1240px;top:555px;width:110px;height:42px"></div>
  <div class="hl" style="left:180px;top:552px;width:460px;height:48px"></div>

  <svg class="ov" viewBox="0 0 1520 730" fill="none">
    <!-- 빨간 표시 앵커 4곳(주소 포함) → 라벨 우측 가운데(392,340)로 수렴 -->
    <circle cx="493" cy="148" r="7" fill="#F5820A" opacity="0.20"/><circle cx="493" cy="148" r="4" fill="#F5820A"/>
    <circle cx="466" cy="259" r="7" fill="#F5820A" opacity="0.20"/><circle cx="466" cy="259" r="4" fill="#F5820A"/>
    <circle cx="466" cy="357" r="7" fill="#F5820A" opacity="0.20"/><circle cx="466" cy="357" r="4" fill="#F5820A"/>
    <circle cx="466" cy="455" r="7" fill="#F5820A" opacity="0.20"/><circle cx="466" cy="455" r="4" fill="#F5820A"/>
    <path d="M493 148 L392 340" stroke="#F5820A" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M466 259 L392 340" stroke="#F5820A" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M466 357 L392 340" stroke="#F5820A" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M466 455 L392 340" stroke="#F5820A" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 검증하기 버튼 → 아래 라벨 -->
    <path d="M1295 599 L1295 646 L1250 646" stroke="#F5820A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 진행률 → 아래 라벨 -->
    <path d="M300 602 L300 650 L340 650" stroke="#F5820A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="cap" style="left:392px;top:340px;transform:translate(-100%,-50%)">채우지 않은 항목이 빨갛게 표시됩니다</div>
  <div class="cap" style="left:1250px;top:646px;transform:translate(-100%,-50%)">누르면 빠진 항목을 한 번에 찾아 줍니다</div>
  <div class="cap" style="left:340px;top:650px;transform:translateY(-50%)">현재 작성 완성도입니다</div>
</div>
</body></html>
