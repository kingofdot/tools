<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><style>
  :root{
    --ink:#0F172A; --muted:#64748B; --edge:#E5EAF2;
    --accent:#EA580C; --accent-15:rgba(234,88,12,.15); --accent-30:rgba(234,88,12,.30);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#FFFFFF;
    -webkit-font-smoothing:antialiased}
  .sheet{position:relative;width:2077px;height:660px;padding:40px}

  /* 화면: 얇은 테두리 + 낮고 넓은 그림자로 살짝 띄운다 */
  .main{position:absolute;left:40px;top:40px;width:1549px;height:580px;
    overflow:hidden;border:1px solid var(--edge);border-radius:14px;background:#fff;
    box-shadow:0 18px 40px -26px rgba(15,23,42,.28), 0 1px 3px rgba(15,23,42,.04)}
  .main img{display:block;width:1549px;margin:-940px 0 0 -0px}

  /* 강조: 글로우 대신 포커스 링 */
  .hl{position:absolute;border:1.5px solid var(--accent);border-radius:7px;
    box-shadow:0 0 0 3px var(--accent-15)}

  .ov{position:absolute;inset:0;pointer-events:none}

  /* 레일 */
  .rail{position:absolute}
  .rail .no{position:absolute;left:0;top:0;width:23px;height:23px;border-radius:50%;
    background:var(--accent);color:#fff;font-size:12px;font-weight:800;
    display:flex;align-items:center;justify-content:center;letter-spacing:-.2px}
  .rail .tx{margin-left:35px}
  .rail .t{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.3px;line-height:1.35}
  .rail .d{margin-top:4px;font-size:14.5px;color:var(--muted);line-height:1.5}
</style></head><body>
<div class="sheet">
  <div class="main"><img src="../갑지/자료/화면캡처/test_컷/test_3.png" alt=""></div>

  <div class="hl" style="left:1441px;top:77px;width:110px;height:26px"></div>
  <div class="hl" style="left:1379px;top:201px;width:150px;height:48px"></div>
  <div class="hl" style="left:79px;top:341px;width:1470px;height:50px"></div>

  <svg class="ov" viewBox="0 0 2077 660" fill="none">
    <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4"
      orient="auto"><path d="M1 1.3 L6.8 4 L1 6.7 Z" fill="var(--accent)"/></marker></defs>
    <path d="M1551 90 C 1594 90, 1594 78, 1630 78" stroke="var(--accent)" stroke-width="1.4" stroke-opacity=".5" stroke-linecap="round"/>
    <circle cx="1551" cy="90" r="3.6" fill="var(--accent)"/><circle cx="1551" cy="90" r="7" fill="none" stroke="var(--accent)" stroke-opacity=".28" stroke-width="1.4"/>
    <path d="M1529 225 C 1584 225, 1584 213, 1630 213" stroke="var(--accent)" stroke-width="1.4" stroke-opacity=".5" stroke-linecap="round"/>
    <circle cx="1529" cy="225" r="3.6" fill="var(--accent)"/><circle cx="1529" cy="225" r="7" fill="none" stroke="var(--accent)" stroke-opacity=".28" stroke-width="1.4"/>
    <path d="M1549 366 C 1593 366, 1593 354, 1630 354" stroke="var(--accent)" stroke-width="1.4" stroke-opacity=".5" stroke-linecap="round"/>
    <circle cx="1549" cy="366" r="3.6" fill="var(--accent)"/><circle cx="1549" cy="366" r="7" fill="none" stroke="var(--accent)" stroke-opacity=".28" stroke-width="1.4"/>
  </svg>

  <div class="rail" style="left:1645px;top:67px;width:392px">
    <div class="no">1</div><div class="tx"><div class="t">주소 추가</div><div class="d">사업장이 여러 곳이면 칸을 늘릴 수 있습니다</div></div>
  </div>
  <div class="rail" style="left:1645px;top:202px;width:392px">
    <div class="no">2</div><div class="tx"><div class="t">주소는 검색으로</div><div class="d">직접 타이핑하지 않고 눌러서 고릅니다</div></div>
  </div>
  <div class="rail" style="left:1645px;top:343px;width:392px">
    <div class="no">3</div><div class="tx"><div class="t">전화번호</div><div class="d">사업장 번호가 없으면 휴대폰 번호를 적어도 됩니다</div></div>
  </div>
</div>
</body></html>
