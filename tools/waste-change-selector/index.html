<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>폐기물처리업 변경사항 선택</title>
<meta name="tool-name" content="폐기물처리업 변경사항 선택">
<meta name="tool-tag" content="환경">
<meta name="tool-description" content="폐기물처리업 처리업 코드와 변경허가/변경신고 구분에 따라 해당하는 변경사항 항목을 골라 선택합니다. 폐기물관리법 시행규칙(시행 2026-03-26) 기준.">
<style>
  :root {
    --bg:#f3f7fb; --surface:#fff; --surface-2:#f1f5f9; --surface-3:#e8eef5;
    --border:#e3e9f0; --border-2:#cbd5e1;
    --text:#1e293b; --text-dim:#475569; --muted:#94a3b8;
    --accent:#2563eb; --accent-bg:rgba(37,99,235,.07); --accent-2:#1d4ed8;
    --success:#059669; --success-2:#047857; --success-bg:rgba(5,150,105,.08);
    --warn:#d97706; --warn-bg:rgba(217,119,6,.10);
    --danger:#dc2626;
    --perm:#7c3aed; --perm-bg:rgba(124,58,237,.08);
    --noti:#0891b2; --noti-bg:rgba(8,145,178,.08);
    --radius:10px;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 2px 8px rgba(15,23,42,.04);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    padding:28px 32px 80px;
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--text); font-size:13px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:980px; margin:0 auto;}

  .page-head{margin-bottom:20px;}
  .page-head h1{
    font-size:19px; font-weight:700; margin:0 0 5px; letter-spacing:-.01em;
    display:flex; align-items:center; gap:9px;
  }
  .page-head h1 .dot{width:7px; height:7px; border-radius:50%; background:var(--accent);}
  .page-head .desc{font-size:12px; color:var(--text-dim); margin:0;}

  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:18px 20px; margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .card-head{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .card-head h2{font-size:13px; font-weight:650; margin:0; letter-spacing:-.01em;}
  .card-head .hint{font-size:11px; color:var(--muted); margin-left:auto;}
  .card-num{
    width:18px; height:18px; border-radius:50%; background:var(--accent); color:#fff;
    font-size:11px; font-weight:700; display:inline-flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }

  /* 처리업 선택 카드 */
  .biz-grid{display:flex; gap:8px; flex-wrap:wrap;}
  .biz-btn{
    border:1px solid var(--border-2); background:var(--surface); color:var(--text);
    border-radius:9px; padding:10px 16px; cursor:pointer; transition:.12s;
    font-family:inherit; font-size:12.5px; font-weight:600; text-align:left;
    display:flex; flex-direction:column; gap:2px; min-width:150px;
  }
  .biz-btn .code{font-size:10.5px; color:var(--muted); font-weight:700; letter-spacing:.04em;}
  .biz-btn:hover{border-color:var(--accent); color:var(--accent-2);}
  .biz-btn.active{
    border-color:var(--accent); background:var(--accent-bg); color:var(--accent-2);
    box-shadow:0 0 0 3px var(--accent-bg);
  }
  .biz-btn.active .code{color:var(--accent);}

  /* changeType 탭 */
  .tabs{display:flex; gap:6px;}
  .tab{
    border:1px solid var(--border-2); background:var(--surface); color:var(--text-dim);
    border-radius:7px; padding:7px 16px; cursor:pointer; font-family:inherit;
    font-size:12px; font-weight:600; transition:.12s;
  }
  .tab:hover{border-color:var(--accent); color:var(--accent-2);}
  .tab.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .tab .cnt{
    font-size:10.5px; margin-left:5px; opacity:.75; font-weight:700;
  }

  /* 항목 목록 */
  .item-list{display:flex; flex-direction:column; gap:8px;}
  .item{
    border:1px solid var(--border); border-radius:9px; padding:11px 13px;
    background:var(--surface); transition:.12s; cursor:pointer;
    display:flex; gap:11px; align-items:flex-start;
  }
  .item:hover{border-color:var(--border-2); background:var(--surface-2);}
  .item.checked{border-color:var(--accent); background:var(--accent-bg); flex-wrap:wrap;}

  /* 변경전/후 입력칸 */
  .change-fields{
    flex-basis:100%; width:100%; margin-top:10px; padding-top:10px;
    border-top:1px dashed var(--border-2);
    display:flex; flex-direction:column; gap:7px; cursor:default;
  }
  .cf-row{display:flex; gap:8px; align-items:flex-start;}
  .cf-row label{
    font-size:10.5px; font-weight:700; width:46px; flex-shrink:0;
    padding-top:6px; text-align:center; border-radius:5px; padding-bottom:6px;
  }
  .cf-before label{color:var(--danger); background:rgba(220,38,38,.08);}
  .cf-after label{color:var(--success-2); background:var(--success-bg);}
  .cf-row textarea{
    flex:1; border:1px solid var(--border-2); border-radius:6px;
    padding:6px 8px; font-family:inherit; font-size:11.5px; line-height:1.5;
    resize:vertical; color:var(--text); background:var(--surface); outline:none;
  }
  .cf-row textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg);}
  .item .chk{
    width:18px; height:18px; border:1.5px solid var(--border-2); border-radius:5px;
    flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#fff; transition:.12s;
  }
  .item.checked .chk{background:var(--accent); border-color:var(--accent);}
  .item-body{flex:1; min-width:0;}
  .item-top{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:3px;}
  .badge{
    font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px; white-space:nowrap;
  }
  .badge.perm{background:var(--perm-bg); color:var(--perm);}
  .badge.noti{background:var(--noti-bg); color:var(--noti);}
  .badge.time{background:var(--warn-bg); color:var(--warn);}
  .item .jo{font-size:10.5px; color:var(--muted); font-weight:600;}
  .item .label{font-size:12.5px; font-weight:600; color:var(--text); line-height:1.45;}
  .item .meta{font-size:11px; color:var(--text-dim); margin-top:4px; display:flex; flex-direction:column; gap:2px;}
  .item .meta .m-cond{color:var(--warn);}
  .item .meta .m-row b{color:var(--text); font-weight:600;}

  .empty{
    font-size:12px; color:var(--muted); padding:24px 8px; text-align:center;
  }

  /* 선택 요약 */
  .sum-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .sum-count{font-size:22px; font-weight:700; color:var(--accent-2);}
  .sum-count .u{font-size:13px; color:var(--muted); font-weight:500; margin-left:3px;}
  .sum-list{display:flex; flex-direction:column; gap:6px;}
  .sum-item-wrap{
    background:var(--surface-2); border:1px solid var(--border); border-radius:7px;
    overflow:hidden;
  }
  .sum-item{
    display:flex; gap:8px; align-items:flex-start; font-size:11.5px; padding:7px 10px;
  }
  .sum-ba{
    padding:7px 10px 8px; border-top:1px dashed var(--border-2);
    display:flex; flex-direction:column; gap:4px; background:var(--surface);
  }
  .sum-ba-row{display:flex; gap:7px; align-items:flex-start; font-size:11px;}
  .sum-ba-row .t{
    font-size:10px; font-weight:700; width:42px; flex-shrink:0; text-align:center;
    border-radius:4px; padding:2px 0;
  }
  .sum-ba-row .t.b{color:var(--danger); background:rgba(220,38,38,.08);}
  .sum-ba-row .t.a{color:var(--success-2); background:var(--success-bg);}
  .sum-ba-row .v{flex:1; color:var(--text); white-space:pre-wrap; word-break:break-word;}
  .sum-ba-row .v .nd{color:var(--muted);}
  .sum-item .jo{color:var(--muted); font-weight:600; white-space:nowrap; font-size:10.5px;}
  .sum-item .lbl{flex:1; color:var(--text); font-weight:600;}
  .sum-item .x{
    color:var(--muted); cursor:pointer; font-size:14px; line-height:1; flex-shrink:0;
  }
  .sum-item .x:hover{color:var(--danger);}

  .btn{
    background:var(--surface); border:1px solid var(--border-2); color:var(--text);
    font-family:inherit; font-size:12px; font-weight:550; padding:7px 13px;
    border-radius:7px; cursor:pointer; transition:.12s;

  .btn.accent{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.accent:hover{background:var(--accent-2);}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}

  .biz-empty{font-size:12px; color:var(--muted); padding:8px 2px;}
  .law-note{font-size:10.5px; color:var(--muted); margin-top:6px;}
</style>
</head>

/* ── 상태 ── */
var STORAGE_KEY = "waste-change-selector.v1";
var BIZ = DATA._meta.bizType_코드;
/* 수집·운반업(TR) 전용 — 처리업 코드 고정 */
var FIXED_BIZ = "TR";
var state = { bizType: FIXED_BIZ, tab: "전체", selected: {} };

function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    var s = JSON.parse(raw);
    if(s && typeof s === "object"){
      if(["전체","변경허가","변경신고"].indexOf(s.tab) !== -1) state.tab = s.tab;
      if(s.selected && typeof s.selected === "object"){
        state.selected = {};
        Object.keys(s.selected).forEach(function(id){
          var v = s.selected[id];
          if(v === true) state.selected[id] = { before:"", after:"" };
          else if(v && typeof v === "object")
            state.selected[id] = { before: v.before || "", after: v.after || "" };
        });
      }
    }
  }catch(e){}
  state.bizType = FIXED_BIZ;
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

/* 현재 처리업 코드로 노출 가능한 항목 */
function visibleItems(){
  if(!state.bizType) return [];
  return DATA.items.filter(function(it){
    return it.bizType.indexOf(state.bizType) !== -1;
  });
}
/* 탭 필터 적용 */
function tabItems(){
  var items = visibleItems();
  if(state.tab === "전체") return items;
  return items.filter(function(it){ return it.changeType === state.tab; });
}
function itemById(id){
  for(var i=0;i<DATA.items.length;i++) if(DATA.items[i].id === id) return DATA.items[i];
  return null;
}

/* ── 렌더 ── */
function renderTabs(){
  var box = document.getElementById("tabs");
  box.innerHTML = "";
  var vis = visibleItems();
  var counts = {
    "전체": vis.length,
    "변경허가": vis.filter(function(i){return i.changeType==="변경허가";}).length,
    "변경신고": vis.filter(function(i){return i.changeType==="변경신고";}).length
  };
  ["전체","변경허가","변경신고"].forEach(function(t){
    var tab = document.createElement("button");
    tab.className = "tab" + (state.tab === t ? " active" : "");
    tab.innerHTML = escapeHtml(t) + '<span class="cnt">' + counts[t] + '</span>';
    tab.addEventListener("click", function(){
      state.tab = t; save(); renderItems(); renderTabs();
    });
    box.appendChild(tab);
  });
}

function renderItems(){
  var box = document.getElementById("itemList");
  var hint = document.getElementById("itemHint");
  box.innerHTML = "";
  if(!state.bizType){
    box.innerHTML = '<div class="empty">먼저 위에서 처리업을 선택하세요.</div>';
    hint.textContent = "";
    return;
  }
  var items = tabItems();
  hint.textContent = BIZ[state.bizType] + " · " + items.length + "개 항목";
  if(items.length === 0){
    box.innerHTML = '<div class="empty">해당하는 변경사항이 없습니다.</div>';
    return;
  }
  items.forEach(function(it){
    var sel = state.selected[it.id];
    var checked = !!sel;
    var row = document.createElement("div");
    row.className = "item" + (checked ? " checked" : "");

    var badgeCls = it.changeType === "변경허가" ? "perm" : "noti";
    var top = '<div class="item-top">' +
      '<span class="badge ' + badgeCls + '">' + escapeHtml(it.changeType) + '</span>';
    if(it.신고시점){
      top += '<span class="badge time">' + escapeHtml(it.신고시점) + '</span>';
    }
    top += '<span class="jo" title="' + escapeHtml(it.조항) + '">' +
           escapeHtml(formatJo(it.조항)) + '</span></div>';

    var meta = "";
    if(it.조건){
      meta += '<div class="m-row m-cond">조건: ' + escapeHtml(it.조건) + '</div>';
    }
    if(it.비고){
      meta += '<div class="m-row"><b>비고:</b> ' + escapeHtml(it.비고) + '</div>';
    }

    row.innerHTML =
      '<div class="chk">' + (checked ? "✓" : "") + '</div>' +
      '<div class="item-body">' +
        top +
        '<div class="label">' + escapeHtml(it.label) + '</div>' +
        (meta ? '<div class="meta">' + meta + '</div>' : '') +
      '</div>';

    /* 체크/해제 — chk·item-body 영역 클릭만 */
    function toggle(){
      if(state.selected[it.id]) delete state.selected[it.id];
      else state.selected[it.id] = { before:"", after:"" };
      save(); renderItems(); renderSummary();
    }
    row.querySelector(".chk").addEventListener("click", toggle);
    row.querySelector(".item-body").addEventListener("click", toggle);

    /* 체크 시 변경전/후 입력칸 */
    if(checked){
      var cf = document.createElement("div");
      cf.className = "change-fields";
      cf.innerHTML =
        '<div class="cf-row cf-before"><label>변경 전</label>' +
        '<textarea rows="2" placeholder="현재 내용"></textarea></div>' +
        '<div class="cf-row cf-after"><label>변경 후</label>' +
        '<textarea rows="2" placeholder="변경할 내용"></textarea></div>';
      var taB = cf.querySelector(".cf-before textarea");
      var taA = cf.querySelector(".cf-after textarea");
      taB.value = sel.before || "";
      taA.value = sel.after || "";
      taB.addEventListener("input", function(){ sel.before = taB.value; save(); });
      taA.addEventListener("input", function(){ sel.after = taA.value; save(); });
      cf.addEventListener("click", function(e){ e.stopPropagation(); });
      row.appendChild(cf);
    }
    box.appendChild(row);
  });
}

function renderSummary(){
  var box = document.getElementById("summary");
  var ids = Object.keys(state.selected).filter(function(id){ return itemById(id); });
  /* 데이터 순서대로 정렬 */
  ids.sort(function(a,b){
    return idxOf(a) - idxOf(b);
  });
  if(ids.length === 0){
    box.innerHTML = '<div class="empty">선택된 변경사항이 없습니다.</div>';
    return;
  }
  var html = '<div class="sum-head"><span class="sum-count">' + ids.length +
             '<span class="u">건 선택</span></span></div><div class="sum-list">';
  ids.forEach(function(id){
    var it = itemById(id);
    var sel = state.selected[id] || {};
    var badgeCls = it.changeType === "변경허가" ? "perm" : "noti";
    var ba = "";
    if((sel.before || "").trim() || (sel.after || "").trim()){
      ba = '<div class="sum-ba">' +
        '<div class="sum-ba-row"><span class="t b">변경 전</span><span class="v">' +
          (escapeHtml(sel.before) || '<span class="nd">—</span>') + '</span></div>' +
        '<div class="sum-ba-row"><span class="t a">변경 후</span><span class="v">' +
          (escapeHtml(sel.after) || '<span class="nd">—</span>') + '</span></div>' +
        '</div>';
    }
    html += '<div class="sum-item-wrap">' +
      '<div class="sum-item">' +
        '<span class="badge ' + badgeCls + '">' + escapeHtml(it.changeType) + '</span>' +
        '<span class="jo" title="' + escapeHtml(it.조항) + '">' + escapeHtml(formatJo(it.조항)) + '</span>' +
        '<span class="lbl">' + escapeHtml(it.label) + '</span>' +
        '<span class="x" data-id="' + escapeHtml(it.id) + '" title="제거">✕</span>' +
      '</div>' + ba +
      '</div>';
  });
  html += '</div>';
  box.innerHTML = html;
  box.querySelectorAll(".x").forEach(function(x){
    x.addEventListener("click", function(){
      delete state.selected[x.dataset.id];
      save(); renderItems(); renderSummary();
    });
  });
}
function idxOf(id){
  for(var i=0;i<DATA.items.length;i++) if(DATA.items[i].id === id) return i;
  return 999;
}

/* 조항 문자열 → 몇조 몇항 몇호 몇목 정식 표기 */
/* 예: "시행규칙 제29조①1.가." → "폐기물관리법 시행규칙 제29조 제1항 제1호 가목" */
var MOK_CHARS = "가나다라마바사아자차카타파하";
function formatJo(raw){
  if(!raw) return "";
  var out = [];
  if(raw.indexOf("시행규칙") !== -1) out.push("폐기물관리법 시행규칙");
  var joM = raw.match(/제(\d+)조/);
  if(joM) out.push("제" + joM[1] + "조");
  var hangM = raw.match(/[①-⑳]/);  /* ①~⑳ */
  if(hangM) out.push("제" + (hangM[0].charCodeAt(0) - 0x2460 + 1) + "항");
  var hoM = raw.match(/[①-⑳](\d+)\./);
  if(hoM) out.push("제" + hoM[1] + "호");
  var mokM = raw.match(/([가-힣])\.\s*$/);
  if(mokM && MOK_CHARS.indexOf(mokM[1]) !== -1) out.push(mokM[1] + "목");
  return out.length ? out.join(" ") : raw;
}

function renderAll(){
  renderTabs();
  renderItems();
  renderSummary();
}

/* 선택 항목 텍스트 복사 */
function selectionText(){
  var ids = Object.keys(state.selected).filter(function(id){ return itemById(id); });
  ids.sort(function(a,b){ return idxOf(a) - idxOf(b); });
  var lines = ["[폐기물처리업 변경사항 선택]"];
  lines.push("처리업: " + (BIZ[state.bizType] || "-"));
  lines.push("");
  ids.forEach(function(id){
    var it = itemById(id);
    var sel = state.selected[id] || {};
    var line = "- [" + it.changeType + "] " + formatJo(it.조항) + " " + it.label;
    if(it.신고시점) line += " (" + it.신고시점 + ")";
    lines.push(line);
    if(it.조건) lines.push("    · 조건: " + it.조건);
    if(it.비고) lines.push("    · 비고: " + it.비고);
    if((sel.before || "").trim()) lines.push("    · 변경 전: " + sel.before.trim());
    if((sel.after  || "").trim()) lines.push("    · 변경 후: " + sel.after.trim());
  });
  return lines.join("\n");
}

/* ── 바인딩 ── */
document.getElementById("copyBtn").addEventListener("click", function(){
  var ids = Object.keys(state.selected).filter(function(id){ return itemById(id); });
  if(ids.length === 0){ alert("선택된 항목이 없습니다."); return; }
  var txt = selectionText();
  var btn = this;
  function done(){ btn.textContent = "복사됨 ✓"; setTimeout(function(){ btn.textContent = "선택 항목 복사"; }, 1500); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt); done(); });
  } else { fallbackCopy(txt); done(); }
});
function fallbackCopy(txt){
  var ta = document.createElement("textarea");
  ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}
document.getElementById("clearBtn").addEventListener("click", function(){
  if(Object.keys(state.selected).length === 0) return;
  if(!confirm("선택한 변경사항을 모두 초기화하시겠습니까?")) return;
  state.selected = {}; save(); renderItems(); renderSummary();
});

/* 법령 안내 */
(function(){
  var L = DATA._meta.법령;
  document.getElementById("lawNote").textContent =
    "근거: " + L.법령명_한글 + " (공포번호 " + L.공포번호 + ", 시행 " +
    L.시행일자.slice(0,4) + "-" + L.시행일자.slice(4,6) + "-" + L.시행일자.slice(6,8) +
    ") · 데이터 버전 " + DATA._meta.버전;
})();

/* ── 시작 ── */
try {
  load();
  renderAll();
} catch (err) {
  console.error(err);
  document.body.insertAdjacentHTML("afterbegin",
    '<div style="padding:14px;margin:12px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;color:#991b1b;">'
    + '<b>초기화 오류</b><br>' + escapeHtml(String((err && err.message) || err)) + '</div>');
}
