<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>폐기물처리업 변경사항 선택</title>
<meta name="tool-name" content="폐기물처리업 변경사항 선택">
<meta name="tool-tag" content="환경">
<meta name="tool-description" content="폐기물처리업 처리업 코드와 변경허가/변경신고 구분에 따라 해당하는 변경사항 항목을 골라 선택합니다. 폐기물관리법 시행규칙(시행 2026-03-26) 기준.">
<style>
  :root {
    --bg:#f3f7fb; --surface:#fff; --surface-2:#f1f5f9; --surface-3:#e8eef5;
    --border:#e3e9f0; --border-2:#cbd5e1;
    --text:#1e293b; --text-dim:#475569; --muted:#94a3b8;
    --accent:#2563eb; --accent-bg:rgba(37,99,235,.07); --accent-2:#1d4ed8;
    --success:#059669; --success-2:#047857; --success-bg:rgba(5,150,105,.08);
    --warn:#d97706; --warn-bg:rgba(217,119,6,.10);
    --danger:#dc2626;
    --perm:#7c3aed; --perm-bg:rgba(124,58,237,.08);
    --noti:#0891b2; --noti-bg:rgba(8,145,178,.08);
    --radius:10px;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 2px 8px rgba(15,23,42,.04);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    padding:28px 32px 80px;
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--text); font-size:13px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:980px; margin:0 auto;}

  .page-head{margin-bottom:20px;}
  .page-head h1{
    font-size:19px; font-weight:700; margin:0 0 5px; letter-spacing:-.01em;
    display:flex; align-items:center; gap:9px;
  }
  .page-head h1 .dot{width:7px; height:7px; border-radius:50%; background:var(--accent);}
  .page-head .desc{font-size:12px; color:var(--text-dim); margin:0;}

  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:18px 20px; margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .card-head{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .card-head h2{font-size:13px; font-weight:650; margin:0; letter-spacing:-.01em;}
  .card-head .hint{font-size:11px; color:var(--muted); margin-left:auto;}
  .card-num{
    width:18px; height:18px; border-radius:50%; background:var(--accent); color:#fff;
    font-size:11px; font-weight:700; display:inline-flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }

  /* 처리업 선택 카드 */
  .biz-grid{display:flex; gap:8px; flex-wrap:wrap;}
  .biz-btn{
    border:1px solid var(--border-2); background:var(--surface); color:var(--text);
    border-radius:9px; padding:10px 16px; cursor:pointer; transition:.12s;
    font-family:inherit; font-size:12.5px; font-weight:600; text-align:left;
    display:flex; flex-direction:column; gap:2px; min-width:150px;
  }
  .biz-btn .code{font-size:10.5px; color:var(--muted); font-weight:700; letter-spacing:.04em;}
  .biz-btn:hover{border-color:var(--accent); color:var(--accent-2);}
  .biz-btn.active{
    border-color:var(--accent); background:var(--accent-bg); color:var(--accent-2);
    box-shadow:0 0 0 3px var(--accent-bg);
  }
  .biz-btn.active .code{color:var(--accent);}

  /* changeType 탭 */
  .tabs{display:flex; gap:6px;}
  .tab{
    border:1px solid var(--border-2); background:var(--surface); color:var(--text-dim);
    border-radius:7px; padding:7px 16px; cursor:pointer; font-family:inherit;
    font-size:12px; font-weight:600; transition:.12s;
  }
  .tab:hover{border-color:var(--accent); color:var(--accent-2);}
  .tab.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .tab .cnt{
    font-size:10.5px; margin-left:5px; opacity:.75; font-weight:700;
  }

  /* 항목 목록 */
  .item-list{display:flex; flex-direction:column; gap:8px;}
  .item{
    border:1px solid var(--border); border-radius:9px; padding:11px 13px;
    background:var(--surface); transition:.12s; cursor:pointer;
    display:flex; gap:11px; align-items:flex-start;
  }
  .item:hover{border-color:var(--border-2); background:var(--surface-2);}
  .item.checked{border-color:var(--accent); background:var(--accent-bg); flex-wrap:wrap;}

  /* 변경전/후 입력칸 */
  .change-fields{
    flex-basis:100%; width:100%; margin-top:10px; padding-top:10px;
    border-top:1px dashed var(--border-2);
    display:flex; flex-direction:column; gap:7px; cursor:default;
  }
  .cf-row{display:flex; gap:8px; align-items:flex-start;}
  .cf-row label{
    font-size:10.5px; font-weight:700; width:46px; flex-shrink:0;
    padding-top:6px; text-align:center; border-radius:5px; padding-bottom:6px;
  }
  .cf-before label{color:var(--danger); background:rgba(220,38,38,.08);}
  .cf-after label{color:var(--success-2); background:var(--success-bg);}
  .cf-row textarea{
    flex:1; border:1px solid var(--border-2); border-radius:6px;
    padding:6px 8px; font-family:inherit; font-size:11.5px; line-height:1.5;
    resize:vertical; color:var(--text); background:var(--surface); outline:none;
  }
  .cf-row textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg);}

  /* 구조화 폼 (fields 스키마) */
  .item-fields{
    flex-basis:100%; width:100%; margin-top:10px; padding-top:10px;
    border-top:1px dashed var(--border-2);
    display:flex; flex-direction:column; gap:10px; cursor:default;
  }
  .fld{display:flex; gap:8px; align-items:center;}
  .fld-label{
    font-size:10.5px; font-weight:600; color:var(--text-dim);
    width:96px; flex-shrink:0;
  }
  .fld-ctrl{flex:1; display:flex; gap:6px; align-items:center;}
  .fld-ctrl input, .fld-ctrl select, .fld-ctrl textarea{
    flex:1; border:1px solid var(--border-2); border-radius:6px;
    padding:5px 8px; font-family:inherit; font-size:11.5px;
    color:var(--text); background:var(--surface); outline:none;
  }
  .fld-ctrl input:focus, .fld-ctrl select:focus, .fld-ctrl textarea:focus{
    border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg);
  }
  .fld-suffix{
    font-size:11px; color:var(--text-dim); padding:0 4px; flex-shrink:0;
  }
  .fld-repeat{
    display:flex; flex-direction:column; gap:8px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:8px; padding:10px 12px;
  }
  .fld-repeat-head{display:flex; align-items:center; gap:8px;}
  .fld-grp-label{font-size:11.5px; font-weight:700; color:var(--text);}
  .fld-repeat-item{
    background:var(--surface); border:1px solid var(--border-2); border-radius:7px;
    padding:8px 10px; display:flex; flex-direction:column; gap:7px;
  }
  .fld-repeat-item-head{
    display:flex; align-items:center; gap:8px;
    padding-bottom:5px; border-bottom:1px dashed var(--border-2);
  }
  .fld-repeat-no{
    font-size:10.5px; font-weight:700; color:var(--accent-2);
    background:var(--accent-bg); padding:2px 8px; border-radius:5px;
  }
  .fld-repeat-rm{
    margin-left:auto;
    width:22px; height:22px; padding:0;
    border:1px solid var(--border-2); border-radius:5px;
    background:var(--surface); color:var(--muted); cursor:pointer;
    font-size:11px; line-height:1;
  }
  .fld-repeat-rm:hover{border-color:var(--danger); color:var(--danger); background:#fff;}
  .fld-repeat-item-body{display:flex; flex-direction:column; gap:6px;}
  .fld-repeat-add{
    align-self:flex-start;
    background:var(--surface); border:1px dashed var(--border-2); color:var(--accent-2);
    font-family:inherit; font-size:11.5px; font-weight:600;
    padding:6px 12px; border-radius:6px; cursor:pointer;
  }
  .fld-repeat-add:hover{border-color:var(--accent); background:var(--accent-bg);}

  /* pair repeat — 변경전/변경후 좌우 분할 */
  .fld-pair-group{
    display:flex; flex-direction:column; gap:8px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:8px; padding:10px 12px;
  }
  .fld-pair-row{
    background:var(--surface); border:1px solid var(--border-2); border-radius:7px;
    padding:8px 10px; display:flex; flex-direction:column; gap:8px;
  }
  .fld-pair-body{display:flex; gap:10px; align-items:flex-start;}
  .fld-pair-col{
    flex:1; min-width:0; padding:8px 10px; border-radius:6px;
    display:flex; flex-direction:column; gap:5px;
  }
  .fld-pair-left{
    background:rgba(220,38,38,.04);
    border:1px solid rgba(220,38,38,.18);
  }
  .fld-pair-right{
    background:var(--success-bg);
    border:1px solid rgba(5,150,105,.22);
  }
  .fld-pair-col-head{
    font-size:10.5px; font-weight:700;
    padding-bottom:4px; border-bottom:1px dashed currentColor;
    margin-bottom:2px;
  }
  .fld-pair-left  .fld-pair-col-head{color:var(--danger);}
  .fld-pair-right .fld-pair-col-head{color:var(--success-2);}
  .fld-pair-col-body{display:flex; flex-direction:column; gap:5px;}
  .fld-pair-col-body .fld-label{width:80px;}  /* 좌우 분할에서 라벨 폭 좁힘 */

  /* compact 모드 — 헤더 생략, 한 줄 인라인 + 자동 비고 뱃지 */
  .fld-pair-row.compact{
    flex-direction:row; align-items:center; gap:10px;
    padding:6px 10px;
  }
  .fld-pair-row.compact .fld-pair-body{flex:1; gap:8px;}
  .fld-pair-row.compact .fld-pair-col{padding:5px 8px; gap:3px;}
  .fld-pair-row.compact .fld-pair-col-head{
    font-size:9.5px; padding-bottom:2px; margin-bottom:0;
  }
  .fld-pair-row.compact .fld-pair-col-body{flex-direction:row; gap:5px;}
  .fld-pair-row.compact .fld{gap:5px;}
  .fld-pair-row.compact .fld-label{display:none;}
  .fld-pair-row.compact .fld-ctrl input{font-size:11.5px; padding:4px 7px;}
  .fld-pair-tail{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .pair-class{
    font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:4px;
    white-space:nowrap;
  }
  .pair-class.add   {background:var(--success-bg);    color:var(--success-2);}
  .pair-class.remove{background:rgba(220,38,38,.08);  color:var(--danger);}
  .pair-class.keep  {background:var(--surface-3);     color:var(--text-dim);}

  /* 테이블 모드 — repeat + compact: 엑셀 같은 그리드 */
  .fld-repeat-table-wrap{
    display:flex; flex-direction:column; gap:8px;
  }
  .fld-table{
    border:1px solid var(--border-2); border-radius:6px;
    overflow:hidden; background:var(--surface);
  }
  .fld-table-tr{
    display:flex; align-items:stretch;
    border-bottom:1px solid var(--border);
  }
  .fld-table-tr:last-child{border-bottom:none;}
  .fld-table-th{
    flex:1; min-width:0;
    background:var(--surface-3); color:var(--text-dim);
    padding:7px 10px; font-size:10.5px; font-weight:700;
    border-right:1px solid var(--border);
  }
  .fld-table-th:last-child{border-right:none;}
  .fld-table-td{
    flex:1; min-width:0;
    border-right:1px solid var(--border);
    display:flex; align-items:stretch;
  }
  .fld-table-td:last-child{border-right:none;}
  .fld-table-td input,
  .fld-table-td select,
  .fld-table-td textarea{
    width:100%; border:none; background:transparent;
    padding:6px 10px; font:inherit; font-size:11.5px;
    color:var(--text); outline:none; text-align:center;
  }
  .fld-table-th{text-align:center;}
  .req-mark{
    color:var(--danger); font-weight:700; margin-left:3px;
  }
  .fld-table-td.cell-disabled{
    background:var(--surface-3);
    opacity:0.55;
  }
  .fld-table-td.cell-disabled input,
  .fld-table-td.cell-disabled select{
    cursor:not-allowed; color:var(--muted);
  }
  .fld-table-td input:focus,
  .fld-table-td select:focus,
  .fld-table-td textarea:focus{
    background:var(--accent-bg);
    box-shadow:inset 0 0 0 2px var(--accent);
  }
  .fld-table-th.fld-table-action,
  .fld-table-td.fld-table-action{
    flex:0 0 44px;
    display:flex; align-items:center; justify-content:center;
    padding:0;
    background:transparent;
    border-right:none;
  }
  .fld-table-td.fld-table-action .fld-repeat-rm{
    width:24px; height:24px; padding:0;
    border:1px solid transparent; border-radius:5px;
    background:transparent; color:var(--muted);
    font-size:13px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .fld-table-td.fld-table-action .fld-repeat-rm:hover{
    border-color:var(--border-2); color:var(--danger); background:var(--surface);
  }

  /* 요약 — 테이블 모드 행 */
  .sum-table-row{
    display:flex; flex-wrap:wrap; gap:8px;
    padding:4px 0; font-size:11px;
    border-bottom:1px dashed var(--border-2);
  }
  .sum-table-row:last-child{border-bottom:none;}
  .sum-table-cell{display:inline-flex; gap:4px; align-items:baseline;}
  .sum-table-cell .k{
    font-weight:600; color:var(--text-dim); font-size:10px;
  }

  /* auto 셀 — 변경사항 자동 분류 */
  .fld-table-td-auto{
    display:flex; align-items:center; justify-content:center;
    background:var(--surface-2);
  }
  .auto-cls{
    font-size:11.5px; color:var(--text);
    padding:0 6px; white-space:normal;   /* 긴 텍스트(폐기물명칭 등)도 wrap */
  }
  /* 짧은 분류 라벨 — 뱃지 스타일 */
  .auto-cls-add, .auto-cls-remove, .auto-cls-keep,
  .auto-cls-perm, .auto-cls-noti, .auto-cls-muted{
    font-size:10.5px; font-weight:700;
    padding:3px 10px; border-radius:4px; white-space:nowrap;
    display:inline-block;
  }
  .auto-cls-add   {background:var(--success-bg);   color:var(--success-2);}
  .auto-cls-remove{background:rgba(220,38,38,.08); color:var(--danger);}
  .auto-cls-keep  {background:var(--surface-3);    color:var(--text-dim);}
  .auto-cls-perm  {background:var(--perm-bg);      color:var(--perm);}
  .auto-cls-noti  {background:var(--noti-bg);      color:var(--noti);}
  .auto-cls-muted {background:var(--surface-3);    color:var(--muted);}

  /* derivedFrom 섹션 */
  .fld-derived{
    display:flex; flex-direction:column; gap:8px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:8px; padding:10px 12px;
  }
  .fld-derived-count{
    font-size:10.5px; font-weight:600; color:var(--muted);
    margin-left:4px;
  }
  .fld-derived-empty{
    font-size:11px; color:var(--muted); padding:14px 8px; text-align:center;
    border:1px dashed var(--border-2); border-radius:6px; background:var(--surface);
  }
  .fld-derived-bind{
    font-size:11px; color:var(--text-dim); margin-left:8px;
  }
  .fld-derived-bind b{color:var(--accent-2); font-weight:600; margin-right:3px;}
  .sum-derived{
    display:flex; flex-direction:column; gap:5px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:6px; padding:6px 9px;
  }

  /* 요약 — pair */
  .sum-pair-grp{
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:6px; padding:6px 9px;
    display:flex; flex-direction:column; gap:5px;
  }
  .sum-pair-body{display:flex; gap:8px; align-items:flex-start;}
  .sum-pair-col{
    flex:1; min-width:0; padding:6px 8px; border-radius:5px;
    display:flex; flex-direction:column; gap:3px;
  }
  .sum-pair-left {background:rgba(220,38,38,.05);  border:1px solid rgba(220,38,38,.18);}
  .sum-pair-right{background:var(--success-bg);     border:1px solid rgba(5,150,105,.22);}
  .sum-pair-col-head{
    font-size:10px; font-weight:700;
    padding-bottom:2px; border-bottom:1px dashed currentColor;
  }
  .sum-pair-left  .sum-pair-col-head{color:var(--danger);}
  .sum-pair-right .sum-pair-col-head{color:var(--success-2);}
  .sum-pair-empty{font-size:10.5px; color:var(--muted); padding:3px 0;}
  .sum-pair-col .sum-form-row .k{width:78px;}

  /* 요약 — 구조화 폼 */
  .sum-form{
    padding:7px 10px 8px; border-top:1px dashed var(--border-2);
    background:var(--surface); display:flex; flex-direction:column; gap:6px;
  }
  .sum-form-grp{
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:6px; padding:6px 9px;
    display:flex; flex-direction:column; gap:4px;
  }
  .sum-form-grp-head{
    font-size:10.5px; font-weight:700; color:var(--accent-2);
    border-bottom:1px dashed var(--border-2); padding-bottom:3px;
  }
  .sum-form-row{display:flex; gap:8px; font-size:11px;}
  .sum-form-row .k{
    font-weight:600; color:var(--text-dim); width:90px; flex-shrink:0;
  }
  .sum-form-row .v{flex:1; color:var(--text); word-break:break-word;}
  .item .chk{
    width:18px; height:18px; border:1.5px solid var(--border-2); border-radius:5px;
    flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#fff; transition:.12s;
  }
  .item.checked .chk{background:var(--accent); border-color:var(--accent);}
  .item-body{flex:1; min-width:0;}
  .item-top{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:3px;}
  .badge{
    font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px; white-space:nowrap;
  }
  .badge.perm{background:var(--perm-bg); color:var(--perm);}
  .badge.noti{background:var(--noti-bg); color:var(--noti);}
  .badge.time{background:var(--warn-bg); color:var(--warn);}
  .item .jo{font-size:10.5px; color:var(--muted); font-weight:600;}
  .jo-sep{font-size:10px; color:var(--border-2); margin:0 4px;}

  /* ℹ 정보 아이콘 + 호버 팝오버 */
  .info-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:16px; height:16px; margin-left:4px; vertical-align:middle;
    border-radius:50%; background:var(--accent-bg); color:var(--accent-2);
    font-size:10px; font-weight:700; cursor:help; position:relative;
    user-select:none;
  }
  .info-icon:hover, .info-icon:focus{
    background:var(--accent); color:#fff; outline:none;
  }
  .info-icon .info-pop{
    display:none; position:absolute;
    bottom:calc(100% + 6px); left:50%; transform:translateX(-50%);
    width:380px; max-width:90vw;
    background:var(--surface); color:var(--text);
    border:1px solid var(--border-2); border-radius:8px;
    box-shadow:0 6px 24px rgba(15,23,42,.15);
    padding:12px 14px; font-size:11.5px; line-height:1.55;
    font-weight:400; text-align:left; cursor:default;
    z-index:100;
  }
  .info-icon:hover .info-pop, .info-icon:focus .info-pop{display:block;}
  .info-icon .info-pop::after{
    content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:var(--surface);
    filter:drop-shadow(0 1px 0 var(--border-2));
  }
  .info-pop-title{
    font-size:12.5px; font-weight:700; color:var(--accent-2);
    border-bottom:1px solid var(--border); padding-bottom:6px; margin-bottom:8px;
  }
  .info-pop-intro{color:var(--text-dim); margin-bottom:8px;}
  .info-pop-cases{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px;}
  .info-pop-cases li{
    padding:6px 8px; background:var(--surface-2); border-radius:5px;
    border-left:3px solid var(--accent);
  }
  .info-pop-no{color:var(--accent-2); margin-right:3px;}

var state = { bizType: FIXED_BIZ, tab: "전체", selected: {}, applicant: {} };

function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    var s = JSON.parse(raw);
    if(s && typeof s === "object"){
      if(["전체","변경허가","변경신고"].indexOf(s.tab) !== -1) state.tab = s.tab;
      if(s.selected && typeof s.selected === "object"){
        state.selected = {};
        Object.keys(s.selected).forEach(function(id){
          var v = s.selected[id];
          if(v === true) state.selected[id] = { before:"", after:"", form:{} };
          else if(v && typeof v === "object")
            state.selected[id] = {
              before: v.before || "",
              after:  v.after  || "",
              form:   (v.form && typeof v.form === "object") ? v.form : {}
            };
        });
      }
      if(s.applicant && typeof s.applicant === "object") state.applicant = s.applicant;
    }
  }catch(e){}
  state.bizType = FIXED_BIZ;
  if(!state.applicant || typeof state.applicant !== "object") state.applicant = {};
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

/* 현재 처리업 코드로 노출 가능한 항목 */
function visibleItems(){
  if(!state.bizType) return [];
  return DATA.items.filter(function(it){
    return it.bizType.indexOf(state.bizType) !== -1;
  });
}

}

  for(var i=0;i<DATA.items.length;i++) if(DATA.items[i].id === id) return DATA.items[i];
  return null;
}

/* changeType / 조항 은 string 또는 string[] 둘 다 허용 — 배열로 통일 */
function changeTypeList(it){
  if(!it || it.changeType == null) return [];
  return Array.isArray(it.changeType) ? it.changeType : [it.changeType];
}
function joList(it){
  if(!it || it.조항 == null) return [];
  return Array.isArray(it.조항) ? it.조항 : [it.조항];
}
function badgeClsFor(ct){
  /* 허가류 → perm(보라), 신고류 → noti(청록) */
  if(/허가/.test(ct)) return "perm";
  if(/신고/.test(ct)) return "noti";
  return "noti";
}
function badgesHtml(it){
  return changeTypeList(it).map(function(ct){
    return '<span class="badge ' + badgeClsFor(ct) + '">' + escapeHtml(ct) + '</span>';
  }).join("");
}
function joDisplayHtml(it){
  return joList(it).map(function(raw){
    return '<span class="jo" title="' + escapeHtml(raw) + '">' + escapeHtml(formatJo(raw)) + '</span>';
  }).join('<span class="jo-sep">·</span>');
}

/* tooltipInfo 객체 → HTML 팝오버 본문 */
function renderTooltipPop(info){
  if(!info) return "";
  var html = '';
  if(info.title) html += '<div class="info-pop-title">' + escapeHtml(info.title) + '</div>';
  if(info.intro) html += '<div class="info-pop-intro">' + escapeHtml(info.intro) + '</div>';
  if(Array.isArray(info.cases) && info.cases.length){
    html += '<ul class="info-pop-cases">';
    info.cases.forEach(function(c){
      var proc = c.procedure ? '<span class="info-pop-proc info-pop-proc-' +
        (/허가/.test(c.procedure)?'perm':'noti') + '">' + escapeHtml(c.procedure) + '</span>' : '';
      html += '<li>' +
        (c.no ? '<b class="info-pop-no">' + escapeHtml(c.no) + '</b> ' : '') +
        '<b>' + escapeHtml(c.label || '') + '</b> ' + proc +
        (c.detail ? '<div class="info-pop-detail">' + escapeHtml(c.detail) + '</div>' : '') +
      '</li>';
    });
    html += '</ul>';
  }
  if(Array.isArray(info.common) && info.common.length){
    html += '<div class="info-pop-common"><div class="info-pop-common-head">공통</div><ul>' +
      info.common.map(function(line){ return '<li>' + escapeHtml(line) + '</li>'; }).join('') +
    '</ul></div>';
  }
  return html;
}

/* ── 렌더 ── */
function renderItems(){
  var box = document.getElementById("itemList");
  var hint = document.getElementById("itemHint");
  box.innerHTML = "";
  if(!state.bizType){
    box.innerHTML = '<div class="empty">먼저 위에서 처리업을 선택하세요.</div>';
    hint.textContent = "";
    return;
  }
  var items = tabItems();
  hint.textContent = BIZ[state.bizType] + " · " + items.length + "개 항목";
  if(items.length === 0){
    box.innerHTML = '<div class="empty">해당하는 변경사항이 없습니다.</div>';
    return;
  }
  items.forEach(function(it){
    var sel = state.selected[it.id];
    var checked = !!sel;
    var row = document.createElement("div");
    row.className = "item" + (checked ? " checked" : "");

    var top = '<div class="item-top">' + badgesHtml(it) + '</div>';

    var meta = "";
    if(it.조건){
      meta += '<div class="m-row m-cond">조건: ' + escapeHtml(it.조건) + '</div>';
    }
    if(it.비고){
      meta += '<div class="m-row"><b>비고:</b> ' + escapeHtml(it.비고) + '</div>';
    }

    /* tooltipInfo 있으면 라벨 옆에 ℹ 아이콘 + 호버 팝오버 */
    var infoIcon = '';
    if(it.tooltipInfo){
      infoIcon = ' <span class="info-icon" tabindex="0">ℹ<span class="info-pop">' +
        renderTooltipPop(it.tooltipInfo) + '</span></span>';
    }

    row.innerHTML =
      '<div class="chk">' + (checked ? "✓" : "") + '</div>' +
      '<div class="item-body">' +
        top +
        '<div class="label">' + escapeHtml(it.label) + infoIcon + '</div>' +
        (it.description ? '<div class="desc">' + escapeHtml(it.description) + '</div>' : '') +
        (meta ? '<div class="meta">' + meta + '</div>' : '') +
      '</div>';

    /* 체크/해제 — chk·item-body 영역 클릭만 */
    function toggle(){
      if(state.selected[it.id]) delete state.selected[it.id];
      else state.selected[it.id] = { before:"", after:"", form:{} };
      save(); renderItems(); renderSummary();
    }
    row.querySelector(".chk").addEventListener("click", toggle);
    row.querySelector(".item-body").addEventListener("click", toggle);
    /* ℹ 아이콘 클릭은 토글되지 않도록 */
    var infoEl = row.querySelector(".info-icon");
    if(infoEl) infoEl.addEventListener("click", function(e){ e.stopPropagation(); });

    /* 체크 시 — fields 스키마 있으면 구조화 폼, 없으면 변경전/후 textarea */
    if(checked){
      if(Array.isArray(it.fields) && it.fields.length){
        if(!sel.form || typeof sel.form !== "object") sel.form = {};
        var fbox = document.createElement("div");
        fbox.className = "item-fields";
        fbox.addEventListener("click", function(e){ e.stopPropagation(); });
        renderFields(it.fields, sel.form, fbox);
        row.appendChild(fbox);
      } else {
        var cf = document.createElement("div");
        cf.className = "change-fields";
        cf.innerHTML =
          '<div class="cf-row cf-before"><label>변경 전</label>' +
          '<textarea rows="2" placeholder="현재 내용"></textarea></div>' +
          '<div class="cf-row cf-after"><label>변경 후</label>' +
          '<textarea rows="2" placeholder="변경할 내용"></textarea></div>';
        var taB = cf.querySelector(".cf-before textarea");
        var taA = cf.querySelector(".cf-after textarea");
        taB.value = sel.before || "";
        taA.value = sel.after || "";
        taB.addEventListener("input", function(){ sel.before = taB.value; save(); });
        taA.addEventListener("input", function(){ sel.after = taA.value; save(); });
        cf.addEventListener("click", function(e){ e.stopPropagation(); });
        row.appendChild(cf);
      }
    }
    box.appendChild(row);
  });
}

function renderSummary(){
  var box = document.getElementById("summary");
  var ids = Object.keys(state.selected).filter(function(id){ return itemById(id); });
  /* 데이터 순서대로 정렬 */
  ids.sort(function(a,b){
    return idxOf(a) - idxOf(b);
  });
  if(ids.length === 0){
    box.innerHTML = '<div class="empty">선택된 변경사항이 없습니다.</div>';
    return;
  }
  var finalProc = determineFinalProcedure();
  var finalProcHtml = finalProc
    ? '<span class="sum-final-badge ' + (finalProc === "변경허가" ? "perm" : "noti") + '">최종 절차: ' + escapeHtml(finalProc) + '</span>'
    : '';
  var html = '<div class="sum-head"><span class="sum-count">' + ids.length +
             '<span class="u">건 선택</span></span>' + finalProcHtml + '</div><div class="sum-list">';
  ids.forEach(function(id){
    var it = itemById(id);
    var sel = state.selected[id] || {};
    var ba = "";
    if(Array.isArray(it.fields) && it.fields.length){
      var fhtml = formSummaryHtml(it.fields, sel.form || {});
      if(fhtml) ba = '<div class="sum-form">' + fhtml + '</div>';
    } else if((sel.before || "").trim() || (sel.after || "").trim()){
      ba = '<div class="sum-ba">' +
        '<div class="sum-ba-row"><span class="t b">변경 전</span><span class="v">' +
          (escapeHtml(sel.before) || '<span class="nd">—</span>') + '</span></div>' +
        '<div class="sum-ba-row"><span class="t a">변경 후</span><span class="v">' +
          (escapeHtml(sel.after) || '<span class="nd">—</span>') + '</span></div>' +
        '</div>';
    }
    html += '<div class="sum-item-wrap">' +
      '<div class="sum-item">' +
        badgesHtml(it) +
        '<span class="lbl">' + escapeHtml(it.label) + '</span>' +
        '<span class="x" data-id="' + escapeHtml(it.id) + '" title="제거">✕</span>' +
      '</div>' + ba +
      '</div>';
  });
  html += '</div>';
  box.innerHTML = html;
  box.querySelectorAll(".x").forEach(function(x){
    x.addEventListener("click", function(){
      delete state.selected[x.dataset.id];
      save(); renderItems(); renderSummary();
    });
  });
}
function idxOf(id){
  for(var i=0;i<DATA.items.length;i++) if(DATA.items[i].id === id) return i;
  return 999;
}

/* 최종 절차 판정
   - V01: 행마다 classifyVehicleProcedure 로 절차 누적
   - 그 외: item.changeType 누적
   - 변경허가 한 건이라도 있으면 → 변경허가, 그 외 모두 변경신고면 → 변경신고
   반환: '변경허가' | '변경신고' | '' (선택 없거나 절차 발생 없음) */
function determineFinalProcedure(){
  var hasPermit = false, hasNotify = false;
  Object.keys(state.selected).forEach(function(id){
    var it = itemById(id);
    if(!it) return;
    var sel = state.selected[id] || {};
    /* V01: 행 단위 절차 */
    if(it.id === "V01" && sel.form && Array.isArray(sel.form.changes)){
      sel.form.changes.forEach(function(row){
        var p = AUTO_COMPUTERS.classifyVehicleProcedure(row);
        if(p === "변경허가") hasPermit = true;
        else if(p === "변경신고") hasNotify = true;
        /* '변경 없음', '' 무시 */
      });
      return;
    }
    /* 일반 항목: item.changeType */
    changeTypeList(it).forEach(function(ct){
      if(ct === "변경허가") hasPermit = true;
      else if(ct === "변경신고") hasNotify = true;
    });
  });
  if(hasPermit) return "변경허가";
  if(hasNotify) return "변경신고";
  return "";
}

/* ── 구조화 폼 (fields 스키마) ── */
/* 지원 type: text / textarea / number / date / select / repeat / pairRepeat / auto / derivedFrom */

/* 자동 계산 함수 — auto 타입 셀과 derivedFrom 필터에서 공용 */
var AUTO_COMPUTERS = {
  classifyChange: function(row){
    var b = String(row.before || "").trim();
    var a = String(row.after  || "").trim();
    if(b && a) return "기존";
    if(b)      return "감차";
    if(a)      return "증차";
    return "";
  },
  /* 차량변경 절차 판정 (사용자 선택값 row.change 기준)
     - 전용차량 + 증차 → 변경허가 (시행규칙 제29조①1.라.)
     - 그 외(전용차량 감차 / 임시차량 증차 / 임시차량 감차) → 변경신고 (제33조①4.)
     - 기존 → 변경 없음
     - 선택 없음 → 빈값 */
  classifyVehicleProcedure: function(row){
    var c = row.change;
    if(!c) return "";
    if(c === "기존") return "변경 없음";
    if(row.category === "전용차량" && c === "증차") return "변경허가";
    return "변경신고";
  },
  /* 폐기물코드 → 폐기물명칭 lookup (WASTE_DATA 전역) */
  lookupWasteName: function(row){
    if(typeof WASTE_DATA === "undefined" || !Array.isArray(WASTE_DATA)) return "";
    var code = String(row.wasteCode || "").trim();
    if(!code) return "";
    var hit = WASTE_DATA.find(function(w){ return w.wasteCode === code; });
    return hit ? hit.wasteName : "";
  }
};
function autoClassKind(text){
  if(text === "증차") return "add";
  if(text === "감차") return "remove";
  if(text === "기존") return "keep";
  if(text === "변경허가") return "perm";
  if(text === "변경신고") return "noti";
  if(text === "변경 없음") return "muted";
  return "";
}

/* datalist 동적 생성 — text 입력에 list 속성 연결 */
function ensureDataList(name){
  var id = "dl-" + name;
  if(document.getElementById(id)) return;
  var dl = document.createElement("datalist");
  dl.id = id;
  if(name === "wastes" && typeof WASTE_DATA !== "undefined"){
    WASTE_DATA.forEach(function(w){
      var opt = document.createElement("option");
      opt.value = w.wasteCode;
      opt.textContent = w.wasteName;   /* Chrome 등에선 코드 옆에 명칭 표시 */
      dl.appendChild(opt);
    });
  }
  document.body.appendChild(dl);
}

/* 필드 onChangeAction — select 등에서 값이 바뀌면 같은 행의 다른 필드를 갱신 */
var FIELD_ACTIONS = {
  /* V01 차량 변경사항 select 변경 시 변경전/후 자동 정리 */
  v01SyncBeforeAfter: function(row, value){
    if(value === "기존"){
      row.after = row.before;
    } else if(value === "증차"){
      row.before = "";
    } else if(value === "감차"){
      row.after = "";
    }
  }
};

/* 페이로드/요약 출력 시 행 필터링 — 빈 행 또는 의미 없는 '기존' 행 제거
   (입력 표에는 표시됨 — 편집 가능해야 하므로) */
function isRowEmptyForPayload(fields, row){
  return !(fields || []).some(function(f){
    if(f.type === "auto") return false;   // auto 는 계산값 — 무시
    var v = row[f.key];
    if(v == null || String(v).trim() === "") return false;
    // defaultValue 와 동일하면 사용자가 채운 게 아니라 자동값 → '비어있다'로 간주
    if(f.defaultValue !== undefined && v === f.defaultValue) return false;
    return true;
  });
}
function isRowSkipForPayload(fields, row){
  // 'change' 컬럼이 있고 값이 '기존'이면 변경 없는 행 → 출력 제외
  if(row.change === "기존") return true;
  return isRowEmptyForPayload(fields, row);
}

/* repeat 새 행 추가 시 defaultValue 적용 */
function makeDefaultRow(subFields){
  var row = {};
  (subFields || []).forEach(function(sub){
    if(sub.defaultValue !== undefined && sub.type !== "auto"){
      row[sub.key] = sub.defaultValue;
    }
  });
  return row;
}


/* pairRepeat 한 줄의 자동 분류 — 변경전·후 채움 여부로 증차/감차/기존 결정 */
function classifyPair(child, leftFields, rightFields, labels){
  function has(side, flds){
    return (flds || []).some(function(fl){
      return child[side] && String(child[side][fl.key] || "").trim() !== "";
    });
  }
  var hL = has("left",  leftFields);
  var hR = has("right", rightFields);
  if(hL && hR) return labels.both       || "기존";
  if(hL)       return labels.removeOnly || "감차";
  if(hR)       return labels.addOnly    || "증차";
  return "";
}
function classBadgeKind(text, labels){
  if(text === (labels.addOnly    || "증차")) return "add";
  if(text === (labels.removeOnly || "감차")) return "remove";
  if(text === (labels.both       || "기존")) return "keep";
  return "";
}

function renderFields(fields, val, container){
  fields.forEach(function(f){
    if(f.type === "derivedFrom"){
      /* 다른 필드(source)에서 filterCompute(filterValue) 매칭 행들로부터
         spec 카드 자동 생성. spec 데이터는 source[i][specsKey] 에 저장. */
      var grp = document.createElement("div");
      grp.className = "fld-derived";
      function rebuild(){
        grp.innerHTML = "";
        var sourceArr = Array.isArray(val[f.source]) ? val[f.source] : [];
        var fn = AUTO_COMPUTERS[f.filterCompute];
        var hits = [];
        if(fn){
          sourceArr.forEach(function(row, i){
            if(fn(row) === f.filterValue) hits.push({ row: row, idx: i });
          });
        }
        var head = document.createElement("div");
        head.className = "fld-repeat-head";
        head.innerHTML = '<span class="fld-grp-label">' + escapeHtml(f.label || "") +
          ' <span class="fld-derived-count">(' + hits.length + '건)</span></span>';
        grp.appendChild(head);
        if(!hits.length){
          var emp = document.createElement("div");
          emp.className = "fld-derived-empty";
          emp.textContent = f.emptyText || "해당 항목이 없습니다";
          grp.appendChild(emp);
          return;
        }
        hits.forEach(function(hit, hIdx){
          var card = document.createElement("div");
          card.className = "fld-repeat-item";
          var hd = document.createElement("div");
          hd.className = "fld-repeat-item-head";
          var bindVal = (f.bindField && hit.row[f.bindField]) || "";
          hd.innerHTML = '<span class="fld-repeat-no">증차 ' + (hIdx+1) + '</span>' +
            ' <span class="fld-derived-bind"><b>' + escapeHtml(f.titleLabel || "") + '</b> ' + escapeHtml(bindVal) + '</span>';
          card.appendChild(hd);
          if(!hit.row[f.specsKey] || typeof hit.row[f.specsKey] !== "object") hit.row[f.specsKey] = {};
          var body = document.createElement("div");
          body.className = "fld-repeat-item-body";
          renderFields(f.fields || [], hit.row[f.specsKey], body);
          card.appendChild(body);
          grp.appendChild(card);
        });
      }
      rebuild();
      /* container 레벨에서 input 이벤트 받아 재빌드 — source 변경 감지 */
      if(!container._derivedRebuilders) container._derivedRebuilders = [];
      container._derivedRebuilders.push(rebuild);
      if(!container._derivedListenerAttached){
        container._derivedListenerAttached = true;
        /* source 셀이 포커스 아웃되면 derived 재빌드 (변경 후 입력 후 탭/클릭 이동 시점) */
        function _onSourceChange(e){
          if(e.target && e.target.closest && e.target.closest(".fld-derived")) return;
          (container._derivedRebuilders || []).forEach(function(r){ r(); });
        }
        container.addEventListener("focusout", _onSourceChange);
        container.addEventListener("change", _onSourceChange);  /* select 즉시 반영 */
      }
      container.appendChild(grp);
      return;
    }
    if(f.type === "pairRepeat"){
      var arr = Array.isArray(val[f.key]) ? val[f.key] : (val[f.key] = []);
      while(arr.length < (f.min || 0)) arr.push({ left:{}, right:{} });
      var grp = document.createElement("div");
      grp.className = "fld-pair-group" + (f.compact ? " compact" : "");
      grp.innerHTML = '<div class="fld-repeat-head"><span class="fld-grp-label">' +
        escapeHtml(f.label || "") + '</span></div>';

      var leftSpec  = f.left  || { fields: [] };
      var rightSpec = f.right || { fields: [] };
      var classifyAs = f.classifyAs || { addOnly: "증차", removeOnly: "감차", both: "기존" };

      arr.forEach(function(child, idx){
        if(!child.left)  child.left  = {};
        if(!child.right) child.right = {};
        var card = document.createElement("div");
        card.className = "fld-pair-row" + (f.compact ? " compact" : "");

        /* compact 모드: 헤더(변경 N) 생략, ✕ + 비고 뱃지 인라인 */
        if(!f.compact){
          var hd = document.createElement("div");
          hd.className = "fld-repeat-item-head";
          hd.innerHTML = '<span class="fld-repeat-no">' + escapeHtml(f.itemLabel || "변경") + ' ' + (idx+1) + '</span>';
          var rmBtnH = document.createElement("button");
          rmBtnH.type = "button"; rmBtnH.className = "fld-repeat-rm";
          rmBtnH.textContent = "✕"; rmBtnH.title = "줄 삭제";
          rmBtnH.addEventListener("click", function(e){
            e.stopPropagation();
            arr.splice(idx, 1);
            while(arr.length < (f.min || 0)) arr.push({ left:{}, right:{} });
            save(); renderItems(); renderSummary();
          });
          hd.appendChild(rmBtnH);
          card.appendChild(hd);
        }

        var body = document.createElement("div");
        body.className = "fld-pair-body";

        var leftCol = document.createElement("div");
        leftCol.className = "fld-pair-col fld-pair-left";
        leftCol.innerHTML = '<div class="fld-pair-col-head">' + escapeHtml(leftSpec.label || "변경 전") + '</div>';
        var leftBody = document.createElement("div");
        leftBody.className = "fld-pair-col-body";
        renderFields(leftSpec.fields || [], child.left, leftBody);
        leftCol.appendChild(leftBody);

        var rightCol = document.createElement("div");
        rightCol.className = "fld-pair-col fld-pair-right";
        rightCol.innerHTML = '<div class="fld-pair-col-head">' + escapeHtml(rightSpec.label || "변경 후") + '</div>';
        var rightBody = document.createElement("div");
        rightBody.className = "fld-pair-col-body";
        renderFields(rightSpec.fields || [], child.right, rightBody);
        rightCol.appendChild(rightBody);

        body.appendChild(leftCol);
        body.appendChild(rightCol);
        card.appendChild(body);

        /* 비고 (자동 분류) + ✕ — compact 모드에선 인라인, 아니면 카드 아래 */
        var tail = document.createElement("div");
        tail.className = "fld-pair-tail";
        var badge = document.createElement("span");
        badge.className = "pair-class";
        tail.appendChild(badge);

        if(f.compact){
          var rmBtn = document.createElement("button");
          rmBtn.type = "button"; rmBtn.className = "fld-repeat-rm";
          rmBtn.textContent = "✕"; rmBtn.title = "줄 삭제";
          rmBtn.addEventListener("click", function(e){
            e.stopPropagation();
            arr.splice(idx, 1);
            while(arr.length < (f.min || 0)) arr.push({ left:{}, right:{} });
            save(); renderItems(); renderSummary();
          });
          tail.appendChild(rmBtn);
        }
        card.appendChild(tail);

        function updateBadge(){
          var cls = classifyPair(child, leftSpec.fields, rightSpec.fields, classifyAs);
          if(cls){
            badge.textContent = cls;
            badge.className = "pair-class " + classBadgeKind(cls, classifyAs);
            badge.style.display = "";
          } else {
            badge.textContent = "";
            badge.className = "pair-class";
            badge.style.display = "none";
          }
        }
        updateBadge();
        card.addEventListener("input", updateBadge);

        grp.appendChild(card);
      });
      var addBtn = document.createElement("button");
      addBtn.type = "button"; addBtn.className = "fld-repeat-add";
      addBtn.textContent = f.addLabel || "+ 줄 추가";
      addBtn.addEventListener("click", function(e){
        e.stopPropagation();
        arr.push({ left:{}, right:{} });
        save(); renderItems(); renderSummary();
      });
      grp.appendChild(addBtn);
      container.appendChild(grp);
      return;
    }
    if(f.type === "repeat" && f.compact){
      /* 테이블 모드 — 엑셀처럼 한 줄에 모든 필드 가로 배치 */
      var arr = Array.isArray(val[f.key]) ? val[f.key] : (val[f.key] = []);
      while(arr.length < (f.min || 0)) arr.push(makeDefaultRow(f.fields));
      var grp = document.createElement("div");
      grp.className = "fld-repeat-table-wrap";
      grp.innerHTML = '<div class="fld-repeat-head"><span class="fld-grp-label">' +
        escapeHtml(f.label || "") + '</span></div>';

      var table = document.createElement("div");
      table.className = "fld-table";

      /* hideFromUI 필드는 표에 보이지 않음 (페이로드에는 포함) */
      var visibleFields = (f.fields || []).filter(function(s){ return !s.hideFromUI; });

      /* 헤더 — required !== false 이면 (*) 표시 (기본 required) */
      var hdr = document.createElement("div");
      hdr.className = "fld-table-tr fld-table-header";
      visibleFields.forEach(function(sub){
        var th = document.createElement("div");
        th.className = "fld-table-th";
        var lbl = sub.label || sub.key;
        if(sub.required !== false){
          th.innerHTML = escapeHtml(lbl) + '<span class="req-mark">*</span>';
        } else {
          th.textContent = lbl;
        }
        hdr.appendChild(th);
      });
      var thA = document.createElement("div");
      thA.className = "fld-table-th fld-table-action";
      hdr.appendChild(thA);
      table.appendChild(hdr);

      /* 행 */
      arr.forEach(function(child, idx){
        var tr = document.createElement("div");
        tr.className = "fld-table-tr";
        var autoCells = [];   // 행 내부의 auto 셀들 (입력 시 재계산)
        visibleFields.forEach(function(sub){
          var td = document.createElement("div");
          td.className = "fld-table-td";
          if(sub.type === "auto"){
            td.classList.add("fld-table-td-auto");
            var span = document.createElement("span");
            span.className = "auto-cls";
            td.appendChild(span);
            autoCells.push({ span: span, compute: sub.compute });
            tr.appendChild(td);
            return;
          }
          var inp;
          if(sub.type === "select"){
            inp = document.createElement("select");
            var empty = document.createElement("option");
            empty.value = ""; empty.textContent = "—";
            inp.appendChild(empty);
            (sub.options || []).forEach(function(o){
              var opt = document.createElement("option");
              if(typeof o === "string"){ opt.value = o; opt.textContent = o; }
              else { opt.value = o.value; opt.textContent = o.label; }
              inp.appendChild(opt);
            });
          } else if(sub.type === "textarea"){
            inp = document.createElement("textarea"); inp.rows = 1;
          } else {
            inp = document.createElement("input");
            inp.type = (sub.type === "date") ? "date" : (sub.type === "number") ? "number" : "text";
            if(sub.dataList){
              ensureDataList(sub.dataList);
              inp.setAttribute("list", "dl-" + sub.dataList);
            }
          }
          if(sub.placeholder) inp.placeholder = sub.placeholder;
          inp.setAttribute("data-key", sub.key);
          inp.value = (child[sub.key] != null) ? child[sub.key] : "";
          inp.addEventListener("input",  function(){
            child[sub.key] = inp.value;
            /* V01 — '기존' 상태에서 변경전 입력 시 변경후 자동 미러 */
            if(sub.key === "before" && child.change === "기존"){
              child.after = inp.value;
              var afterEl = tr.querySelector('[data-key="after"]');
              if(afterEl) afterEl.value = inp.value;
            }
            save();
          });
          inp.addEventListener("change", function(){
            child[sub.key] = inp.value;
            save();
            /* onChangeAction (select 등) → 같은 행 다른 필드 갱신 후 행 재구성 */
            if(sub.onChangeAction && FIELD_ACTIONS[sub.onChangeAction]){
              FIELD_ACTIONS[sub.onChangeAction](child, inp.value);
              save(); renderItems(); renderSummary();
            }
          });
          inp.addEventListener("click",  function(e){ e.stopPropagation(); });
          td.appendChild(inp);
          tr.appendChild(td);
        });
        function refreshAutoCells(){
          autoCells.forEach(function(ac){
            var fn = AUTO_COMPUTERS[ac.compute];
            var v = fn ? fn(child) : "";
            ac.span.textContent = v;
            ac.span.className = "auto-cls" + (v ? " auto-cls-" + autoClassKind(v) : "");
          });
        }
        refreshAutoCells();
        /* controlsState — 한 필드(보통 select)의 값이 다른 필드들의 활성/비활성 결정 */
        function refreshConditionalStates(){
          (f.fields || []).forEach(function(sub){
            if(!sub.controlsState) return;
            var curVal = child[sub.key];
            var state = sub.controlsState[curVal] || {};
            var disableKeys = Array.isArray(state.disable) ? state.disable : [];
            /* 같은 row 의 모든 입력에 대해 적용 */
            tr.querySelectorAll("[data-key]").forEach(function(el){
              var k = el.getAttribute("data-key");
              if(k === sub.key) return;   // 자기 자신은 건드리지 않음
              var should = disableKeys.includes(k);
              var td = el.closest(".fld-table-td");
              if(el.tagName === "SELECT") el.disabled = should;
              else el.readOnly = should;
              if(td) td.classList.toggle("cell-disabled", should);
            });
          });
        }
        refreshConditionalStates();
        if(autoCells.length){
          /* 행 밖으로 진짜 나갈 때만 갱신 — 행 내부 이동(변경전→변경후)에선 보류 */
          tr.addEventListener("focusout", function(e){
            if(e.relatedTarget && tr.contains(e.relatedTarget)) return;
            refreshAutoCells();
          });
          /* select 등 즉시 확정 입력엔 change 로 바로 반영 */
          tr.addEventListener("change", function(e){
            if(e.target && e.target.tagName === "SELECT") refreshAutoCells();
          });
        }
        var tdA = document.createElement("div");
        tdA.className = "fld-table-td fld-table-action";
        var rm = document.createElement("button");
        rm.type = "button"; rm.className = "fld-repeat-rm";
        rm.textContent = "✕"; rm.title = "줄 삭제";
        rm.addEventListener("click", function(e){
          e.stopPropagation();
          arr.splice(idx, 1);
          while(arr.length < (f.min || 0)) arr.push(makeDefaultRow(f.fields));
          save(); renderItems(); renderSummary();
        });
        tdA.appendChild(rm);
        tr.appendChild(tdA);
        table.appendChild(tr);
      });
      grp.appendChild(table);

      var addBtn = document.createElement("button");
      addBtn.type = "button"; addBtn.className = "fld-repeat-add";
      addBtn.textContent = f.addLabel || "+ 줄 추가";
      addBtn.addEventListener("click", function(e){
        e.stopPropagation();
        arr.push(makeDefaultRow(f.fields));
        save(); renderItems(); renderSummary();
      });
      grp.appendChild(addBtn);
      container.appendChild(grp);
      return;
    }
    if(f.type === "repeat"){
      var arr = Array.isArray(val[f.key]) ? val[f.key] : (val[f.key] = []);
      while(arr.length < (f.min || 0)) arr.push(makeDefaultRow(f.fields));
      var grp = document.createElement("div");
      grp.className = "fld-repeat";
      grp.innerHTML = '<div class="fld-repeat-head"><span class="fld-grp-label">' +
        escapeHtml(f.label || "") + '</span></div>';
      arr.forEach(function(child, idx){
        var card = document.createElement("div");
        card.className = "fld-repeat-item";
        var hd = document.createElement("div");
        hd.className = "fld-repeat-item-head";
        hd.innerHTML = '<span class="fld-repeat-no">' + escapeHtml(f.itemLabel || "항목") + ' ' + (idx+1) + '</span>';
        var rmBtn = document.createElement("button");
        rmBtn.type = "button";
        rmBtn.className = "fld-repeat-rm";
        rmBtn.textContent = "✕";
        rmBtn.title = "삭제";
        rmBtn.addEventListener("click", function(e){
          e.stopPropagation();
          arr.splice(idx, 1);
          while(arr.length < (f.min || 0)) arr.push(makeDefaultRow(f.fields));
          save(); renderItems(); renderSummary();
        });
        hd.appendChild(rmBtn);
        card.appendChild(hd);
        var body = document.createElement("div");
        body.className = "fld-repeat-item-body";
        renderFields(f.fields, child, body);
        card.appendChild(body);
        grp.appendChild(card);
      });
      var addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "fld-repeat-add";
      addBtn.textContent = f.addLabel || "+ 추가";
      addBtn.addEventListener("click", function(e){
        e.stopPropagation();
        arr.push(makeDefaultRow(f.fields));
        save(); renderItems(); renderSummary();
      });
      grp.appendChild(addBtn);
      container.appendChild(grp);
      return;
    }
    /* 단일 필드 */
    var wrap = document.createElement("div");
    wrap.className = "fld";
    var lbl = document.createElement("label");
    lbl.className = "fld-label";
    lbl.textContent = f.label || f.key;
    wrap.appendChild(lbl);
    var ctrlWrap = document.createElement("div");
    ctrlWrap.className = "fld-ctrl";
    var inp;
    if(f.type === "textarea"){
      inp = document.createElement("textarea");
      inp.rows = f.rows || 2;
    } else if(f.type === "select"){
      inp = document.createElement("select");
      if(!f.required){
        var empty = document.createElement("option");
        empty.value = ""; empty.textContent = "— 선택 —";
        inp.appendChild(empty);
      }
      (f.options || []).forEach(function(o){
        var opt = document.createElement("option");
        if(typeof o === "string"){ opt.value = o; opt.textContent = o; }
        else { opt.value = o.value; opt.textContent = o.label; }
        inp.appendChild(opt);
      });
    } else {
      inp = document.createElement("input");
      inp.type = (f.type === "date") ? "date"
              : (f.type === "number") ? "number"
              : "text";
    }
    if(f.placeholder) inp.placeholder = f.placeholder;
    inp.value = (val[f.key] != null) ? val[f.key] : "";
    inp.addEventListener("input", function(){ val[f.key] = inp.value; save(); });
    inp.addEventListener("change", function(){ val[f.key] = inp.value; save(); });
    inp.addEventListener("click", function(e){ e.stopPropagation(); });
    ctrlWrap.appendChild(inp);
    if(f.suffix){
      var sfx = document.createElement("span");
      sfx.className = "fld-suffix";
      sfx.textContent = f.suffix;
      ctrlWrap.appendChild(sfx);
    }
    wrap.appendChild(ctrlWrap);
    container.appendChild(wrap);
  });
}

/* 폼 값 → 요약 HTML */
function formSummaryHtml(fields, val){
  var parts = [];
  fields.forEach(function(f){
    if(f.type === "derivedFrom"){
      var sourceArr = Array.isArray(val[f.source]) ? val[f.source] : [];
      var fn = AUTO_COMPUTERS[f.filterCompute];
      if(!fn) return;
      var hits = sourceArr.filter(function(row){ return fn(row) === f.filterValue; });
      if(!hits.length) return;
      var inner = "";
      hits.forEach(function(row, idx){
        var specs = row[f.specsKey] || {};
        var sub = formSummaryHtml(f.fields || [], specs);
        var bind = (f.bindField && row[f.bindField]) || "";
        inner += '<div class="sum-form-grp">' +
          '<div class="sum-form-grp-head">증차 ' + (idx+1) +
          (bind ? ' · ' + escapeHtml(f.titleLabel || "") + ' ' + escapeHtml(bind) : '') +
          '</div>' + (sub || '<div class="sum-pair-empty">제원 미입력</div>') + '</div>';
      });
      parts.push('<div class="sum-derived"><div class="sum-form-grp-head">' + escapeHtml(f.label || "") + '</div>' + inner + '</div>');
      return;
    }
    if(f.type === "pairRepeat"){
      var arr = Array.isArray(val[f.key]) ? val[f.key] : [];
      if(!arr.length) return;
      var labels = f.classifyAs || { addOnly:"증차", removeOnly:"감차", both:"기존" };
      arr.forEach(function(child, idx){
        var leftFlds  = (f.left  && f.left.fields)  || [];
        var rightFlds = (f.right && f.right.fields) || [];
        var leftIn  = formSummaryHtml(leftFlds,  child.left  || {});
        var rightIn = formSummaryHtml(rightFlds, child.right || {});
        if(!leftIn && !rightIn) return;
        var cls = classifyPair(child, leftFlds, rightFlds, labels);
        var clsKind = cls ? classBadgeKind(cls, labels) : "";
        var badgeHtml = cls
          ? '<span class="pair-class ' + clsKind + '">' + escapeHtml(cls) + '</span>'
          : '';
        var head = f.compact
          ? '<div class="sum-form-grp-head">' + escapeHtml(f.label || "") + ' #' + (idx+1) + ' ' + badgeHtml + '</div>'
          : '<div class="sum-form-grp-head">' + escapeHtml(f.itemLabel || f.label) + ' ' + (idx+1) + ' ' + badgeHtml + '</div>';
        parts.push('<div class="sum-pair-grp">' + head +
          '<div class="sum-pair-body">' +
            '<div class="sum-pair-col sum-pair-left">' +
              '<div class="sum-pair-col-head">' + escapeHtml((f.left||{}).label || "변경 전") + '</div>' +
              (leftIn || '<div class="sum-pair-empty">—</div>') +
            '</div>' +
            '<div class="sum-pair-col sum-pair-right">' +
              '<div class="sum-pair-col-head">' + escapeHtml((f.right||{}).label || "변경 후") + '</div>' +
              (rightIn || '<div class="sum-pair-empty">—</div>') +
            '</div>' +
          '</div>' +
          '</div>');
      });
      return;
    }
    if(f.type === "repeat" && f.compact){
      var arr = Array.isArray(val[f.key]) ? val[f.key] : [];
      if(!arr.length) return;
      var visible = (f.fields || []).filter(function(s){ return !s.hideFromUI; });
      var rowsHtml = arr.filter(function(child){
        return !isRowSkipForPayload(f.fields, child);
      }).map(function(child){
        var cells = visible.map(function(sub){
          if(sub.type === "auto"){
            var fn = AUTO_COMPUTERS[sub.compute];
            var v = fn ? fn(child) : "";
            if(!v) return null;
            var kind = autoClassKind(v);
            return '<span class="sum-table-cell"><span class="k">' + escapeHtml(sub.label) + '</span> <span class="auto-cls' + (kind ? ' auto-cls-' + kind : '') + '">' + escapeHtml(v) + '</span></span>';
          }
          var v = child[sub.key];
          if(v == null || String(v).trim() === "") return null;
          return '<span class="sum-table-cell"><span class="k">' + escapeHtml(sub.label) + '</span> ' + escapeHtml(v) + (sub.suffix ? ' ' + escapeHtml(sub.suffix) : '') + '</span>';
        }).filter(Boolean).join('');
        return cells ? '<div class="sum-table-row">' + cells + '</div>' : '';
      }).filter(Boolean).join('');
      if(rowsHtml){
        parts.push('<div class="sum-form-grp"><div class="sum-form-grp-head">' + escapeHtml(f.label || '') + '</div>' + rowsHtml + '</div>');
      }
      return;
    }
    if(f.type === "repeat"){
      var arr = Array.isArray(val[f.key]) ? val[f.key] : [];
      if(!arr.length) return;
      arr.forEach(function(child, idx){
        var inner = formSummaryHtml(f.fields, child);
        if(inner){
          parts.push('<div class="sum-form-grp">' +
            '<div class="sum-form-grp-head">' + escapeHtml(f.itemLabel || f.label) + ' ' + (idx+1) + '</div>' +
            inner + '</div>');
        }
      });
    } else {
      var v = val[f.key];
      if(v == null || String(v).trim() === "") return;
      parts.push('<div class="sum-form-row"><span class="k">' +
        escapeHtml(f.label || f.key) + '</span><span class="v">' +
        escapeHtml(v) + (f.suffix ? ' ' + escapeHtml(f.suffix) : '') + '</span></div>');
    }
  });
  return parts.join("");
}

/* 폼 값 → 복사용 텍스트 줄 배열 */
function formTextLines(fields, val, indent){
  var pad = ""; for(var i=0;i<indent;i++) pad += "    ";
  var out = [];
  fields.forEach(function(f){
    if(f.type === "pairRepeat"){
      var arr = Array.isArray(val[f.key]) ? val[f.key] : [];
      var labels = f.classifyAs || { addOnly:"증차", removeOnly:"감차", both:"기존" };
      arr.forEach(function(child, idx){
        var leftFlds  = (f.left  && f.left.fields)  || [];
        var rightFlds = (f.right && f.right.fields) || [];
        var leftLines  = formTextLines(leftFlds,  child.left  || {}, indent + 2);
        var rightLines = formTextLines(rightFlds, child.right || {}, indent + 2);
        if(!leftLines.length && !rightLines.length) return;
        var cls = classifyPair(child, leftFlds, rightFlds, labels);
        var head = f.compact
          ? (f.label || "변경") + " #" + (idx+1)
          : (f.itemLabel || f.label) + " " + (idx+1);
        out.push(pad + "· " + head + (cls ? "  [" + cls + "]" : ""));
        if(leftLines.length){
          out.push(pad + "    [" + ((f.left||{}).label || "변경 전") + "]");
          out = out.concat(leftLines);
        }
        if(rightLines.length){
          out.push(pad + "    [" + ((f.right||{}).label || "변경 후") + "]");
          out = out.concat(rightLines);
        }
      });
      return;
    }
    if(f.type === "derivedFrom"){
      var sourceArr = Array.isArray(val[f.source]) ? val[f.source] : [];
      var fn = AUTO_COMPUTERS[f.filterCompute];
      if(!fn) return;
      var hits = sourceArr.filter(function(row){ return fn(row) === f.filterValue; });
      if(!hits.length) return;
      out.push(pad + "· " + (f.label || "") + " (" + hits.length + "건)");
      hits.forEach(function(row, idx){
        var bind = (f.bindField && row[f.bindField]) || "";
        out.push(pad + "    · 증차 " + (idx+1) + (bind ? " · " + (f.titleLabel || "") + ": " + bind : ""));
        out = out.concat(formTextLines(f.fields || [], row[f.specsKey] || {}, indent + 2));
      });
      return;
    }
    if(f.type === "repeat" && f.compact){
      var arr = Array.isArray(val[f.key]) ? val[f.key] : [];
      arr.forEach(function(child){
        if(isRowSkipForPayload(f.fields, child)) return;   // 빈 행 / '기존' 행 제외
        var parts = (f.fields || []).map(function(sub){
          if(sub.type === "auto"){
            var fn = AUTO_COMPUTERS[sub.compute];
            var v = fn ? fn(child) : "";
            return v ? sub.label + ": " + v : null;
          }
          var v = child[sub.key];
          if(v == null || String(v).trim() === "") return null;
          return sub.label + ": " + v + (sub.suffix ? " " + sub.suffix : "");
        }).filter(Boolean).join(" / ");
        if(parts) out.push(pad + "· " + parts);
      });
      return;
    }
    if(f.type === "repeat"){
      var arr = Array.isArray(val[f.key]) ? val[f.key] : [];
      arr.forEach(function(child, idx){
        var inner = formTextLines(f.fields, child, indent + 1);
        if(inner.length){
          out.push(pad + "· " + (f.itemLabel || f.label) + " " + (idx+1));
          out = out.concat(inner);
        }
      });
    } else {
      var v = val[f.key];
      if(v == null || String(v).trim() === "") return;
      out.push(pad + "· " + (f.label || f.key) + ": " + v + (f.suffix ? " " + f.suffix : ""));
    }
  });
  return out;
}

/* 조항 문자열 → 몇조 몇항 몇호 몇목 정식 표기 */
/* 예: "시행규칙 제29조①1.가." → "폐기물관리법 시행규칙 제29조 제1항 제1호 가목" */
var MOK_CHARS = "가나다라마바사아자차카타파하";
function formatJo(raw){
  if(!raw) return "";
  var out = [];
  if(/시행규칙/.test(raw))      out.push("폐기물관리법 시행규칙");
  else if(/시행령/.test(raw))   out.push("폐기물관리법 시행령");
  else if(/^법\s|^폐기물관리법/.test(raw)) out.push("폐기물관리법");
  var joM = raw.match(/제(\d+)조/);
  if(joM) out.push("제" + joM[1] + "조");
  var hangM = raw.match(/[①-⑳]/);  /* ①~⑳ */
  if(hangM) out.push("제" + (hangM[0].charCodeAt(0) - 0x2460 + 1) + "항");
  var hoM = raw.match(/[①-⑳](\d+)\./);
  if(hoM) out.push("제" + hoM[1] + "호");
  var mokM = raw.match(/([가-힣])\.\s*$/);
  if(mokM && MOK_CHARS.indexOf(mokM[1]) !== -1) out.push(mokM[1] + "목");
  return out.length ? out.join(" ") : raw;
}

/* 신청인 정보 폼 렌더 */
function renderApplicant(){
  var box = document.getElementById("applicantGrid");
  if(!box) return;
  box.innerHTML = "";
  APPLICANT_FIELDS.forEach(function(f){
    var wrap = document.createElement("label");
    wrap.className = "app-fld" + (f.full ? " app-fld-full" : "");
    var lbl = document.createElement("span");
    lbl.className = "app-fld-label";
    if(f.required !== false){
      lbl.innerHTML = escapeHtml(f.label) + '<span class="req-mark">*</span>';
    } else {
      lbl.textContent = f.label;
    }
    var inp = document.createElement("input");
    inp.type = f.type || "text";
    if(f.placeholder) inp.placeholder = f.placeholder;
    inp.value = state.applicant[f.key] || "";
    inp.addEventListener("input", function(){
      state.applicant[f.key] = inp.value;
      save();
    });
    wrap.appendChild(lbl);
    wrap.appendChild(inp);
    box.appendChild(wrap);
  });
}

function renderAll(){
  renderApplicant();
  renderItems();
  renderSummary();
}

/* 선택 항목 텍스트 복사 */
function selectionText(){
  var ids = Object.keys(state.selected).filter(function(id){ return itemById(id); });
  ids.sort(function(a,b){ return idxOf(a) - idxOf(b); });
  var lines = ["[폐기물처리업 변경사항 선택]"];
  lines.push("처리업: " + (BIZ[state.bizType] || "-"));
  var finalProc = determineFinalProcedure();
  if(finalProc) lines.push("최종 절차: " + finalProc);
  lines.push("");
  /* 신청인 정보 */
  var anyApp = APPLICANT_FIELDS.some(function(f){ return (state.applicant[f.key] || "").trim(); });
  if(anyApp){
    lines.push("[신청인 정보]");
    APPLICANT_FIELDS.forEach(function(f){
      var v = (state.applicant[f.key] || "").trim();
      if(v) lines.push("  · " + f.label + ": " + v);
    });
    lines.push("");
  }
  ids.forEach(function(id){
    var it = itemById(id);
    var sel = state.selected[id] || {};
    var ctText = changeTypeList(it).join("/");
    var joText = joList(it).map(formatJo).join(" / ");
    var line = "- [" + ctText + "] " + joText + " " + it.label;
    if(it.신고시점) line += " (" + it.신고시점 + ")";
    lines.push(line);
    if(it.조건) lines.push("    · 조건: " + it.조건);
    if(it.비고) lines.push("    · 비고: " + it.비고);
    if(Array.isArray(it.fields) && it.fields.length){
      lines = lines.concat(formTextLines(it.fields, sel.form || {}, 1));
    } else {
      if((sel.before || "").trim()) lines.push("    · 변경 전: " + sel.before.trim());
      if((sel.after  || "").trim()) lines.push("    · 변경 후: " + sel.after.trim());
    }
  });
  return lines.join("\n");
}

/* ── 바인딩 ── */
document.getElementById("copyBtn").addEventListener("click", function(){
  var ids = Object.keys(state.selected).filter(function(id){ return itemById(id); });
  if(ids.length === 0){ alert("선택된 항목이 없습니다."); return; }
  var txt = selectionText();
  var btn = this;
  function done(){ btn.textContent = "복사됨 ✓"; setTimeout(function(){ btn.textContent = "선택 항목 복사"; }, 1500); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt); done(); });
  } else { fallbackCopy(txt); done(); }
});
function fallbackCopy(txt){
  var ta = document.createElement("textarea");
  ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}
document.getElementById("clearBtn").addEventListener("click", function(){
  if(Object.keys(state.selected).length === 0) return;
  if(!confirm("선택한 변경사항을 모두 초기화하시겠습니까?")) return;
  state.selected = {}; save(); renderItems(); renderSummary();
});
