<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>풍량 및 농도 계산기</title>
<meta name="tool-name" content="풍량 및 농도 계산기">
<meta name="tool-tag" content="환경">
<meta name="tool-description" content="배출시설별로 N개 후드의 배출가스량(풍량)·표준풍량을 산정하고 배출구별로 집계합니다. 대기오염방지시설 설계실무편람(1999) 제1장 후드 형태별 산정식·포착속도표 내장.">

<style>
  :root {
    --bg:         #f3f7fb;
    --surface:    #ffffff;
    --surface-2:  #f1f5f9;
    --surface-3:  #e8eef5;
    --border:     #e3e9f0;
    --border-2:   #cbd5e1;
    --text:       #1e293b;
    --text-dim:   #475569;
    --muted:      #94a3b8;
    --accent:     #2563eb;
    --accent-bg:  rgba(37,99,235,0.07);
    --accent-2:   #1d4ed8;
    --success:    #059669;
    --success-2:  #047857;
    --success-bg: rgba(5,150,105,0.08);
    --warn:       #d97706;
    --warn-bg:    rgba(217,119,6,0.10);
    --danger:     #dc2626;
    --radius:     10px;
    --shadow:     0 1px 2px rgba(15,23,42,0.04), 0 2px 8px rgba(15,23,42,0.04);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    padding: 28px 32px 64px;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  /* ── 헤더 ── */
  .page-head { margin-bottom: 22px; }
  .page-head h1 {
    font-size: 19px; font-weight: 700; margin: 0 0 5px; letter-spacing: -0.01em;
    display: flex; align-items: center; gap: 9px;
  }
  .page-head h1 .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .page-head .desc { font-size: 12px; color: var(--text-dim); margin: 0; }

  /* ── 카드 ── */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .card-head h2 { font-size: 13px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .card-head .hint { font-size: 11px; color: var(--muted); margin-left: auto; }

  /* ── 입력 요소 ── */
  select, input[type="text"], input[type="number"] {
    background: var(--surface); border: 1px solid var(--border-2);
    color: var(--text); border-radius: 7px; padding: 7px 9px;
    font-family: inherit; font-size: 12px; outline: none; transition: .12s;
  }
  select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  input[type="number"] { text-align: right; font-variant-numeric: tabular-nums; }
  input::placeholder { color: var(--muted); }

  .btn {
    background: var(--surface); border: 1px solid var(--border-2); color: var(--text);
    font-family: inherit; font-size: 12px; font-weight: 550; padding: 7px 13px;
    border-radius: 7px; cursor: pointer; transition: .12s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-2); }
  .btn.ghost { background: transparent; }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.accent:hover { background: var(--accent-2); color: #fff; }
  .btn-row { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .del-btn {
    background: transparent; border: 1px solid var(--border-2); color: var(--muted);
    width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 14px;
    line-height: 1; transition: .12s; flex-shrink: 0;
  }
  .del-btn:hover { border-color: var(--danger); color: var(--danger); }
  .del-btn.sm { width: 22px; height: 22px; font-size: 12px; }

  /* ── 전체 설정 ── */
  .settings-row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-end; }
  .set-fld { display: flex; flex-direction: column; gap: 5px; }
  .set-fld label {
    font-size: 10px; color: var(--text-dim); font-weight: 600;
    letter-spacing: 0.03em; text-transform: uppercase;
  }
  .set-fld select { width: 110px; }
  .set-fld .note { font-size: 10.5px; color: var(--muted); }

  /* ── 배출시설 카드 ── */
  .facility {
    border: 1px solid var(--border-2); border-left: 3px solid var(--accent);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px;
    background: var(--surface);
  }
  .facility:last-of-type { margin-bottom: 0; }
  .fac-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .fac-head .fac-idx {
    font-size: 11px; font-weight: 700; color: var(--accent-2);
    background: var(--accent-bg); border-radius: 6px; padding: 4px 9px; white-space: nowrap;
  }
  .fac-head input.fac-name { flex: 1; font-weight: 550; }

  /* ── 원료·연료 ── */
  .fac-mats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .mat-group {
    flex: 1; min-width: 300px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
  }
  .mat-group-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    font-size: 11px; font-weight: 650; color: var(--text-dim);
  }
  .mat-group-head .add-mat { margin-left: auto; font-size: 10.5px; padding: 4px 10px; }
  .mat-list { display: flex; flex-direction: column; gap: 6px; }
  .mat-row { display: flex; gap: 6px; align-items: center; }
  .mat-row .m-name { flex: 1; min-width: 70px; }
  .mat-row .m-val { width: 86px; }
  .mat-row .m-unit { width: 78px; }
  .mat-empty { font-size: 10.5px; color: var(--muted); padding: 2px 0; }
  .mat-block {
    display: flex; flex-direction: column; gap: 5px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 7px;
  }
  .emis-wrap {
    display: flex; flex-direction: column; gap: 4px;
    margin-left: 4px; padding-left: 8px; border-left: 2px solid var(--border-2);
  }
  .emis-head { font-size: 9.5px; font-weight: 650; color: var(--muted); letter-spacing: 0.02em; }
  .emis-row { display: flex; gap: 5px; align-items: center; }
  .emis-row .e-sub { flex: 1; min-width: 70px; }
  .emis-row .e-coef { width: 92px; }
  .emis-add { align-self: flex-start; font-size: 10px; padding: 3px 8px; }

  /* ── 후드 행 ── */
  .hoods { display: flex; flex-direction: column; gap: 8px; }
  .hood {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
  }
  .hood .hno {
    font-size: 10.5px; font-weight: 650; color: var(--muted);
    align-self: center; white-space: nowrap;
  }
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld > label {
    font-size: 10px; color: var(--text-dim); font-weight: 600;
    letter-spacing: 0.02em; white-space: nowrap;
  }
  .fld input { width: 84px; }
  .fld .shape-sel { width: 168px; }
  .fld .outlet-in { width: 124px; }
  .fld .v-wrap { display: flex; gap: 4px; }
  .fld .v-wrap input { width: 66px; }
  .fld .v-wrap select { width: 64px; padding: 7px 4px; }
  .fld.pol > label { color: var(--accent-2); }
  .fld.pol .pol-val {
    width: 84px; padding: 7px 9px; border: 1px solid var(--border);
    border-radius: 7px; background: var(--surface-2);
    font-size: 12px; text-align: right; font-variant-numeric: tabular-nums;
    color: var(--accent-2); font-weight: 600; min-height: 31px;
  }
  .fac-ophours { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .fac-ophours label { font-size: 11px; color: var(--text-dim); font-weight: 600; }
  .fac-ophours input { width: 72px; }
  .fac-ophours .u { font-size: 10.5px; color: var(--muted); }
  .hood .qbox {
    margin-left: auto; text-align: right; align-self: center;
    display: flex; flex-direction: column; gap: 1px;
  }
  .hood .qbox .qv {
    font-size: 15px; font-weight: 700; color: var(--accent-2);
    font-variant-numeric: tabular-nums;
  }
  .hood .qbox .qv .u { font-size: 10px; color: var(--muted); font-weight: 500; margin-left: 2px; }
  .hood .qbox .qh { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .fac-foot {
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border-2);
    display: flex; align-items: center; gap: 10px;
  }
  .fac-foot .sub-lbl { font-size: 11px; color: var(--text-dim); font-weight: 600; }
  .fac-foot .sub-val {
    margin-left: auto; font-size: 13.5px; font-weight: 700; color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .fac-foot .sub-val .u { font-size: 10px; color: var(--muted); font-weight: 500; margin-left: 2px; }
  .fac-foot .sub-val .sep { color: var(--border-2); margin: 0 8px; }

  /* ── 배출구별 집계 ── */
  table.outlet-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.outlet-tbl th {
    text-align: right; font-size: 10.5px; font-weight: 650; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.03em;
    padding: 8px 10px; border-bottom: 1px solid var(--border-2); white-space: nowrap;
  }
  table.outlet-tbl th:first-child { text-align: left; }
  table.outlet-tbl td {
    padding: 9px 10px; border-bottom: 1px solid var(--border);
    text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  table.outlet-tbl td:first-child { text-align: left; font-weight: 600; color: var(--text); }
  table.outlet-tbl tbody tr:hover td { background: var(--surface-2); }
  table.outlet-tbl .u { font-size: 10px; color: var(--muted); font-weight: 500; margin-left: 2px; }
  table.outlet-tbl tfoot td {
    font-weight: 700; color: var(--accent-2);
    border-top: 2px solid var(--border-2); border-bottom: 0;
    background: var(--accent-bg);
  }
  .outlet-empty { font-size: 11px; color: var(--muted); padding: 6px 2px; }

  /* ── 안내 / 참고 ── */
  .formula-note {
    font-size: 11px; color: var(--text-dim); line-height: 1.7;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 14px;
  }
  .formula-note code {
    color: var(--accent-2); background: var(--accent-bg);
    padding: 1px 5px; border-radius: 4px; font-size: 10.5px;
  }
  .formula-note b { color: var(--text); }
  .collapse-toggle {
    cursor: pointer; user-select: none; color: var(--text-dim);
    font-size: 11px; transition: .12s; margin-left: auto;
  }
  .collapse-toggle:hover { color: var(--text); }
  .hidden { display: none !important; }

  .ref-sec { margin-bottom: 16px; }
  .ref-sec:last-child { margin-bottom: 0; }
  .ref-sec h3 { font-size: 11.5px; font-weight: 650; color: var(--accent-2); margin: 0 0 7px; }
  table.ref { width: 100%; border-collapse: collapse; font-size: 11px; }
  table.ref th {
    text-align: left; font-weight: 650; color: var(--text-dim);
    padding: 6px 8px; border-bottom: 1px solid var(--border-2); background: var(--surface-2);
  }
  table.ref td {
    padding: 5px 8px; border-bottom: 1px solid var(--border); color: var(--text-dim);
    vertical-align: top;
  }
  table.ref td.v { font-variant-numeric: tabular-nums; color: var(--accent-2); font-weight: 600; white-space: nowrap; }
  table.ref tr:hover td { background: var(--surface-2); }
</style>
</head>
<body>
<div class="wrap">

  <header class="page-head">
    <h1><span class="dot"></span>풍량 및 농도 계산기</h1>
    <p class="desc">배출시설별 후드 배출가스량(풍량) 산정 · 대기오염방지시설 설계실무편람(대구지방환경관리청, 1999) 제1장 기준</p>
  </header>

  <!-- ── 전체 설정 ── -->
  <div class="card">
    <div class="card-head"><h2>전체 설정</h2></div>
    <div class="settings-row">
      <div class="set-fld">
        <label>소수 자릿수</label>
        <select id="decimalsSel">
          <option value="0">0 자리</option>
          <option value="1">1 자리</option>
          <option value="2">2 자리</option>
          <option value="3">3 자리</option>
          <option value="4">4 자리</option>
        </select>
      </div>
      <div class="set-fld">
        <span class="note">모든 풍량·표준풍량·온도 표시에 적용됩니다.</span>
      </div>
    </div>
  </div>

  <!-- ── 배출시설·후드 ── -->
  <div class="card">
    <div class="card-head">
      <h2>배출시설별 후드 풍량 산정</h2>
      <span class="hint">치수 단위: m · 풍량 Q: ㎥/min · 표준풍량 Qs: S㎥/min</span>
    </div>
    <div id="facList"></div>
    <div class="btn-row">
      <button class="btn accent" id="addFac">+ 배출시설 추가</button>
      <button class="btn ghost" id="clearAll">전체 비우기</button>
    </div>
  </div>

  <!-- ── 배출구별 집계 ── -->
  <div class="card">
    <div class="card-head">
      <h2>배출구별 집계</h2>
      <span class="hint">전체 후드를 배출구 기준으로 합산 · 온도는 풍량 가중평균</span>
    </div>
    <div id="outletSection"></div>
  </div>

  <!-- ── 산식 안내 ── -->
  <div class="card">
    <div class="card-head"><h2>후드 형태별 산정식</h2></div>
    <div class="formula-note" id="formulaList"></div>
  </div>

  <!-- ── 포착속도 참고표 ── -->
  <div class="card">
    <div class="card-head">
      <h2>포착(제어)속도 참고표</h2>
      <span class="collapse-toggle" id="refCollapse">펼치기 ▼</span>
    </div>
    <div id="refBody" class="hidden"></div>
  </div>

</div>

<script>
"use strict";

/* ── 후드 형태별 산정식 (편람 제1장 표 II) ───────────────────────────
   V 는 m/min 으로 환산하여 대입, Q 단위 ㎥/min */
var SHAPES = [
  { id: "slot",                 label: "슬롯트형",        dims: ["L", "X"],
    formula: "Q = 3.7 · L · V · X",
    calc: function (d, v) { return 3.7 * d.L * v * d.X; } },
  { id: "flanged_slot",         label: "프랜지 슬롯트형", dims: ["L", "X"],
    formula: "Q = 2.6 · L · V · X",
    calc: function (d, v) { return 2.6 * d.L * v * d.X; } },
  { id: "plain_opening",        label: "편평개구형",      dims: ["W", "L", "X"],
    formula: "Q = V · (10X² + A),  A = W·L",
    calc: function (d, v) { return v * (10 * d.X * d.X + d.W * d.L); } },
  { id: "flanged_opening",      label: "프랜지개구형",    dims: ["W", "L", "X"],
    formula: "Q = 0.75 · V · (10X² + A),  A = W·L",
    calc: function (d, v) { return 0.75 * v * (10 * d.X * d.X + d.W * d.L); } },
  { id: "plain_multiple_slot",  label: "복수스롯트형",    dims: ["W", "L", "X"],
    formula: "Q = V · (10X² + A),  A = W·L",
    calc: function (d, v) { return v * (10 * d.X * d.X + d.W * d.L); } },
  { id: "flanged_multiple_slot",label: "프랜지복수개구형",dims: ["W", "L", "X"],
    formula: "Q = 0.75 · V · (10X² + A),  A = W·L",
    calc: function (d, v) { return 0.75 * v * (10 * d.X * d.X + d.W * d.L); } },
  { id: "booth",                label: "밀폐형(부스)",    dims: ["W", "H"],
    formula: "Q = V · A,  A = W·H",
    calc: function (d, v) { return v * d.W * d.H; } },
  { id: "canopy",               label: "천정형(캐노피)",  dims: ["P", "D"],
    formula: "Q = 1.4 · P · V · D",
    calc: function (d, v) { return 1.4 * d.P * v * d.D; } }
];
function shapeById(id) {
  for (var i = 0; i < SHAPES.length; i++) if (SHAPES[i].id === id) return SHAPES[i];
  return SHAPES[0];
}
var DIM_LABEL = {
  L: "길이 L (m)", W: "폭 W (m)", X: "포집거리 X (m)",
  H: "부스높이 H (m)", P: "오염원둘레 P (m)", D: "포집거리 D (m)"
};

/* ── 포착속도 참고표 (편람 표1-1 / 1-2 / 1-3) ── */
var REF = {
  table1_1: {
    title: "표1-1 일반적으로 사용되는 포착속도의 개략치",
    cols: ["배출상태", "공정 예", "포착속도 (m/sec)"],
    rows: [
      ["움직이지 않는 공기중 거의 속도 없는 상태", "용기 액면에서 발생하는 가스·증기·흄", "0.25~0.5"],
      ["비교적 조용한 대기중 낮은 속도로 비산", "부스식 분무도장, 간헐 용기충진, 저속 컨베이어, 도금·용접·산세척", "0.5~1.0"],
      ["빠른 공기이동 작업장에 활발히 비산", "부스식 분무·함침도장, 컨베이어 낙하구 분쇄, 파쇄기", "1.0~2.5"],
      ["대단히 빠른 공기이동, 아주 빠른 속도로 비산", "연삭, 분무, 텀블링, 블라스트", "2.5~10.0"]
    ]
  },
  table1_2: {
    title: "표1-2 발생원과 후드형태에 따른 포착속도",
    cols: ["발생원", "후드형태", "포착속도 (m/sec)", "포착점"],
    rows: [
      ["sand blast room", "포위박스형", "0.3~0.5", "개구면"],
      ["sand blast table", "부스형", "1.0", "개구면"],
      ["포장작업(종이포장대)", "부스형", "0.5", "개구면"],
      ["포장작업(마대포장대)", "부스형", "1.0", "개구면"],
      ["저장투입", "포위카바형", "0.8~1.0", "개구면"],
      ["병세척", "부스형(건물)", "0.8~1.3", "개구면"],
      ["콘베이어이송", "포위카바형", "0.8~1.0", "개구면"],
      ["단조(수동)", "부스형(건물)", "1.0", "개구면"],

var STORAGE_KEY = "airflow-concentration-calc.v1";

/* ── 상태 ── */
var state = {
  decimals: 1,
  facilities: [],   // [{ name, materials:[], fuels:[], hoods:[{shape,dims,v,vUnit,t,outlet}] }]
  refCollapsed: true
};

function emptyHood() { return { shape: "slot", dims: {}, v: "", vUnit: "ms", t: "", outlet: "", pollutants: {} }; }
function emptyEmission() { return { substance: "", coefficient: "" }; }
function emptyMat() { return { name: "", value: "", unit: "", emissions: [] }; }
function emptyFacility() { return { name: "", operatingHours: "", materials: [], fuels: [], hoods: [emptyHood()] }; }

function normEmissions(a) {
  return Array.isArray(a) ? a.map(function (e) {
    return { substance: (e && e.substance) || "", coefficient: (e && e.coefficient) || "" };
  }) : [];
}
function normMats(a) {
  return Array.isArray(a) ? a.map(function (m) {
    return {
      name: (m && m.name) || "", value: (m && m.value) || "", unit: (m && m.unit) || "",
      emissions: normEmissions(m && m.emissions)
    };
  }) : [];
}

/* ── 저장/복원 ── */
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}
function load() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s && typeof s === "object") {
        var d = parseInt(s.decimals, 10);
        state.decimals = (isFinite(d) && d >= 0 && d <= 6) ? d : 1;
        state.refCollapsed = s.refCollapsed !== false;
        if (Array.isArray(s.facilities)) {
          state.facilities = s.facilities.map(function (f) {
            return {
              name: f.name || "",
              operatingHours: f.operatingHours || "",
              materials: normMats(f.materials),
              fuels: normMats(f.fuels),
              hoods: (Array.isArray(f.hoods) ? f.hoods : []).map(function (h) {
                return {
                  shape: shapeById(h.shape).id,
                  dims: (h.dims && typeof h.dims === "object") ? h.dims : {},
                  v: h.v || "",
                  vUnit: h.vUnit === "mm" ? "mm" : "ms",
                  t: h.t || "",
                  outlet: h.outlet || "",
                  pollutants: (h.pollutants && typeof h.pollutants === "object") ? h.pollutants : {}
                };
              })
            };
          });
        }
      }
    }
  } catch (e) {}
  if (state.facilities.length === 0) state.facilities = [emptyFacility()];
  state.facilities.forEach(function (f) { if (f.hoods.length === 0) f.hoods.push(emptyHood()); });
}

/* ── 숫자 유틸 ── */
function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0; }
function fmt(n) {
  if (!isFinite(n)) n = 0;
  var dec = (state.decimals != null) ? state.decimals : 1;
  var p = Math.pow(10, dec);
  return (Math.round(n * p) / p).toLocaleString("ko-KR", { maximumFractionDigits: dec });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

/* ── 후드 풍량 계산 (㎥/min) ── */
function hoodQ(h) {
  var sh = shapeById(h.shape);
  var vMin = num(h.v) * (h.vUnit === "ms" ? 60 : 1);   // m/sec → m/min
  var d = {};
  sh.dims.forEach(function (k) { d[k] = num(h.dims[k]); });
  var q = sh.calc(d, vMin);
  return isFinite(q) && q > 0 ? q : 0;
}

/* ── 표준풍량 (0℃ 표준상태 환산, S㎥/min) — Qs = Q × 273/(273+T) ── */
function hoodQstd(h) {
  var q = hoodQ(h);
  var denom = 273 + num(h.t);
  if (denom <= 0) return 0;
  return q * 273 / denom;
}

/* ── 배출시설의 원료·연료에서 배출물질명 수집 (중복 제거, 입력순) ── */
function collectSubstances(fac) {
  var seen = {}, out = [];
  ["materials", "fuels"].forEach(function (kind) {
    (fac[kind] || []).forEach(function (m) {
      (m.emissions || []).forEach(function (e) {
        var s = (e.substance || "").trim();
        if (s && !seen[s]) { seen[s] = true; out.push(s); }
      });
    });
  });
  return out;
}

/* ── 배출물질별 분자값 = Σ(원료·연료 사용량 × 해당 물질 배출계수) ── */
function substanceNumerator(fac, subName) {
  var sum = 0;
  ["materials", "fuels"].forEach(function (kind) {
    (fac[kind] || []).forEach(function (m) {
      var usage = num(m.value);
      if (!usage) return;
      (m.emissions || []).forEach(function (e) {
        if ((e.substance || "").trim() === subName) sum += usage * num(e.coefficient);
      });
    });
  });
  return sum;
}

  qh.className = "qh";
  hRef.qv = qv; hRef.qh = qh;
  qbox.appendChild(qv); qbox.appendChild(qh);
  row.appendChild(qbox);

  /* 삭제 */
  var del = document.createElement("button");
  del.className = "del-btn"; del.type = "button"; del.textContent = "×";
  del.title = "후드 삭제";
  del.addEventListener("click", function () {
    fac.hoods.splice(hi, 1);
    if (fac.hoods.length === 0) fac.hoods.push(emptyHood());
    save(); renderFacilities();
  });
  row.appendChild(del);

  return row;
}

/* ── 가벼운 재계산: 입력칸 그대로 두고 풍량·소계·집계만 갱신 ── */
function recalc() {
  var outlets = {}, order = [];   // 배출구명 → { q, std, qt }
  state.facilities.forEach(function (fac, fi) {
    var facRef = refs[fi];
    var subtotal = 0, subStd = 0;
    fac.hoods.forEach(function (h, hi) {
      var q = hoodQ(h), qs = hoodQstd(h);
      subtotal += q; subStd += qs;
      var hRef = facRef && facRef.hoods[hi];
      if (hRef && hRef.qv) {
        hRef.qv.innerHTML = fmt(q) + '<span class="u">㎥/min</span>';
        hRef.qh.textContent = "표준 " + fmt(qs) + " S㎥/min";
      }
      if (hRef && hRef.pols) {
        var opMin = num(fac.operatingHours) * 60;
        hRef.pols.forEach(function (p) {
          var denom = opMin * qs;   // 가동시간 × 60 × 표준풍량
          p.el.textContent = denom > 0 ? fmt(substanceNumerator(fac, p.sub) / denom) : "—";
        });
      }
      var key = (h.outlet || "").trim() || "(미지정)";
      if (!outlets[key]) { outlets[key] = { q: 0, std: 0, qt: 0 }; order.push(key); }
      outlets[key].q += q;
      outlets[key].std += qs;
      outlets[key].qt += q * num(h.t);
    });
    if (facRef && facRef.sub) facRef.sub.innerHTML =
      '풍량 ' + fmt(subtotal) + '<span class="u">㎥/min</span><span class="sep">|</span>표준 ' +
      fmt(subStd) + '<span class="u">S㎥/min</span>';
  });
  renderOutletSection(outlets, order);
}

/* ── 렌더: 배출구별 집계 섹션 ── */
function renderOutletSection(outlets, order) {
  var box = document.getElementById("outletSection");
  box.innerHTML = "";

  if (order.length === 0) {
    var e = document.createElement("div");
    e.className = "outlet-empty";
    e.textContent = "후드를 추가하고 배출구를 입력하면 배출구별 집계가 표시됩니다.";
    box.appendChild(e);
    return;
  }

  var tbl = document.createElement("table");
  tbl.className = "outlet-tbl";
  tbl.innerHTML =
    '<thead><tr><th>배출구</th><th>풍량</th><th>표준풍량</th><th>온도</th></tr></thead>';

  var tbody = document.createElement("tbody");
  var tQ = 0, tS = 0, tQT = 0;
  order.forEach(function (k) {
    var o = outlets[k];
    var temp = o.q > 0 ? o.qt / o.q : 0;
    tQ += o.q; tS += o.std; tQT += o.qt;
    var tr = document.createElement("tr");
    tr.innerHTML =
      '<td>' + escapeHtml(k) + '</td>' +
      '<td>' + fmt(o.q) + '<span class="u">㎥/min</span></td>' +
      '<td>' + fmt(o.std) + '<span class="u">S㎥/min</span></td>' +
      '<td>' + fmt(temp) + '<span class="u">℃</span></td>';
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);

  var overallTemp = tQ > 0 ? tQT / tQ : 0;
  var tfoot = document.createElement("tfoot");
  var ftr = document.createElement("tr");
  ftr.innerHTML =
    '<td>합계</td>' +
    '<td>' + fmt(tQ) + '<span class="u">㎥/min</span></td>' +
    '<td>' + fmt(tS) + '<span class="u">S㎥/min</span></td>' +
    '<td>' + fmt(overallTemp) + '<span class="u">℃</span></td>';
  tfoot.appendChild(ftr);
  tbl.appendChild(tfoot);

  box.appendChild(tbl);
}

/* ── 렌더: 산식 안내 ── */
function renderFormulaList() {
  var box = document.getElementById("formulaList");
  var html = "";
  SHAPES.forEach(function (s) {
    html += '<b>' + s.label + '</b> &nbsp;<code>' + s.formula + '</code><br>';
  });
  html += '<br>V 는 포착속도, 산정식에는 <b>m/min</b> 단위로 환산해 대입합니다 (m/s 입력 시 ×60 자동 변환). ' +
          'Q 는 배출가스량(풍량), 단위 <b>㎥/min</b>. L·W·X·H·P·D 는 모두 <b>m</b> 단위. ' +
          'A 는 후드 개구면적(㎡).' +
          '<br><b>표준풍량</b> &nbsp;<code>Qs = Q × 273 / (273 + T)</code> &nbsp;— 온도 T(℃) 기준 0℃ 표준상태 환산, 단위 <b>S㎥/min</b>.' +
          '<br><b>배출구</b> — 후드별로 배출시설→방지시설 경로를 구분합니다. 한 배출시설의 후드가 서로 다른 배출구로 나갈 수 있으며, ' +
          '전체 후드를 배출구 기준으로 합산한 결과가 「배출구별 집계」 섹션에 표시됩니다 (온도는 풍량 가중평균).' +
          '<br><b>오염물질 농도</b> &nbsp;<code>농도 = Σ(원료·연료 사용량 × 배출계수) ÷ (가동시간 × 60 × 표준풍량)</code>' +
          ' &nbsp;— 원료·연료에 배출물질·배출계수를 입력하면 각 후드의 농도가 자동 계산됩니다. 원료 사용량은 배출시설 전체 양을 각 후드가 그대로 사용하며, ' +
          '가동시간(hr)은 배출시설 단위로 입력합니다. 단위는 입력값에 따릅니다.';
  box.innerHTML = html;
}

/* ── 렌더: 포착속도 참고표 ── */
function renderRef() {
  var box = document.getElementById("refBody");
  box.innerHTML = "";

  [REF.table1_1, REF.table1_2].forEach(function (t) {
    var sec = document.createElement("div");
    sec.className = "ref-sec";
    var h3 = document.createElement("h3"); h3.textContent = t.title;
    sec.appendChild(h3);
    sec.appendChild(buildTable(t.cols, t.rows, t.cols.length - 1));
    box.appendChild(sec);
  });

  var sec3 = document.createElement("div");
  sec3.className = "ref-sec";
  var h3 = document.createElement("h3"); h3.textContent = REF.table1_3.title;
  sec3.appendChild(h3);
  REF.table1_3.groups.forEach(function (g) {
    var sub = document.createElement("div");
    sub.style.cssText = "font-size:11px;color:var(--text-dim);font-weight:600;margin:8px 0 4px;";
    sub.textContent = "· " + g.sub;
    sec3.appendChild(sub);
    sec3.appendChild(buildTable(g.cols, g.rows, g.cols.length - 1));
  });
  var note = document.createElement("div");
  note.style.cssText = "font-size:10.5px;color:var(--muted);margin-top:8px;";
  note.textContent = REF.table1_3.note;
  sec3.appendChild(note);
  box.appendChild(sec3);

  box.classList.toggle("hidden", state.refCollapsed);
  document.getElementById("refCollapse").textContent = state.refCollapsed ? "펼치기 ▼" : "접기 ▲";
}
function buildTable(cols, rows, valColIdx) {
  var tbl = document.createElement("table");
  tbl.className = "ref";
  var thead = document.createElement("thead");
  var htr = document.createElement("tr");
  cols.forEach(function (c) { var th = document.createElement("th"); th.textContent = c; htr.appendChild(th); });
  thead.appendChild(htr); tbl.appendChild(thead);
  var tbody = document.createElement("tbody");
  rows.forEach(function (r) {
    var tr = document.createElement("tr");
    r.forEach(function (cell, ci) {
      var td = document.createElement("td");
      td.textContent = cell;
      if (ci === valColIdx) td.className = "v";
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  return tbl;
}

/* ── 이벤트 ── */
function bind() {
  document.getElementById("decimalsSel").addEventListener("change", function (e) {
    var d = parseInt(e.target.value, 10);
    state.decimals = isFinite(d) ? d : 1;
    save(); recalc();
  });
  document.getElementById("addFac").addEventListener("click", function () {
    state.facilities.push(emptyFacility()); save(); renderFacilities();
  });
  document.getElementById("clearAll").addEventListener("click", function () {
    state.facilities = [emptyFacility()]; save(); renderFacilities();
  });
  document.getElementById("refCollapse").addEventListener("click", function () {
    state.refCollapsed = !state.refCollapsed; save(); renderRef();
  });
}

/* ── 시작 ── */
load();
document.getElementById("decimalsSel").value = String(state.decimals);
bind();
renderFacilities();
renderFormulaList();
renderRef();
</script>
</body>
</html>
